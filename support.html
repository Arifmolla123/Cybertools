<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Tools Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #070d17;
            color: #e0f0ec;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            max-width: 860px;
            width: 100%;
            background: linear-gradient(145deg, #0f1a26, #091018);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid #1e3347;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 #2a4a5a;
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 820px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1fc7b0;
            padding-bottom: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1fc7b0, #b0fff0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .icon {
            font-size: 2rem;
            color: #1fc7b0;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .lang-indicator {
            background: #0d1a26;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #1e3347;
            font-size: 0.7rem;
            color: #88b8b0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-indicator i {
            color: #1fc7b0;
        }
        .chat-window {
            background: #0a121e;
            border-radius: 20px;
            padding: 16px;
            flex: 1;
            min-height: 350px;
            max-height: 100%;
            overflow-y: auto;
            border: 1px solid #1a2e3e;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }
        .chat-window::-webkit-scrollbar { width: 4px; }
        .chat-window::-webkit-scrollbar-track { background: #0a121e; }
        .chat-window::-webkit-scrollbar-thumb { background: #1fc7b0; border-radius: 10px; }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeUp 0.3s ease;
            position: relative;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1a2e3e, #0f1f2e);
            border-bottom-right-radius: 4px;
            border: 1px solid #2a4a5a;
            color: #d0f0ea;
        }
        .msg.bot {
            align-self: flex-start;
            background: #0d1a26;
            border-left: 4px solid #1fc7b0;
            border-bottom-left-radius: 4px;
            color: #e0f0ec;
            white-space: pre-wrap;
        }
        .msg.bot strong { color: #b0fff0; }
        .msg .time {
            font-size: 0.6rem;
            color: #5f8a88;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .typing-indicator {
            align-self: flex-start;
            background: #0d1a26;
            padding: 10px 18px;
            border-radius: 30px;
            border-left: 4px solid #1fc7b0;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #88b8b0;
            font-size: 0.8rem;
        }
        .typing-indicator .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #1fc7b0;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #0a121e;
            border-radius: 60px;
            padding: 6px 6px 6px 18px;
            border: 1px solid #1a2e3e;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .input-area:focus-within {
            border-color: #1fc7b0;
            box-shadow: 0 0 0 3px #1fc7b022;
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #d0f0ea;
            font-size: 0.95rem;
            padding: 10px 0;
            outline: none;
            min-width: 140px;
            font-family: inherit;
        }
        .input-area input::placeholder {
            color: #3a5a5a;
        }
        .input-area .btn {
            background: #1fc7b0;
            border: none;
            color: #0b1119;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .input-area .btn:active { transform: scale(0.95); }
        .input-area .btn:disabled { opacity: 0.5; pointer-events: none; }
        .input-area .btn-outline {
            background: transparent;
            color: #88b8b0;
            border: 1px solid #1a2e3e;
            padding: 10px 16px;
        }
        .input-area .btn-outline:hover {
            border-color: #1fc7b0;
            color: #b0fff0;
        }
        .footer {
            text-align: center;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #2a4a5a;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .footer a {
            color: #3a6a7a;
            text-decoration: none;
            transition: 0.2s;
        }
        .footer a:hover { color: #1fc7b0; }
        @media (max-width: 480px) {
            .app { padding: 12px; max-height: 98vh; height: 98vh; }
            .header-left h1 { font-size: 1.2rem; }
            .chat-window { min-height: 250px; padding: 12px; }
            .msg { font-size: 0.85rem; padding: 10px 14px; }
            .input-area { padding: 4px 4px 4px 14px; }
            .input-area .btn { padding: 8px 16px; font-size: 0.8rem; }
        }
        .glow-border {
            position: relative;
        }
        .glow-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 32px;
            background: linear-gradient(135deg, #1fc7b033, #f5b34233);
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body>
<div class="app glow-border">
    <div class="header">
        <div class="header-left">
            <span class="icon"><i class="fas fa-headset"></i></span>
            <h1>Cyber Tools Support</h1>
        </div>
        <div class="header-right">
            <span class="lang-indicator"><i class="fas fa-globe"></i> <span id="langLabel">English</span></span>
        </div>
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="msg bot">
            👋 Hello! I'm the Cyber Tools support agent.<br>
            Ask me about app features, VIP unlock, tools, groups, channels, or the developer.<br>
            <span style="font-size:0.8rem;color:#5f8a88;">(Bengali, English, Hindi, Hinglish, Arabic, Urdu – all supported)</span>
            <div class="time"><i class="far fa-clock"></i> Now</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your question here...">
        <button class="btn" id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        <button class="btn btn-outline" id="clearBtn" title="Clear chat"><i class="fas fa-eraser"></i></button>
    </div>

    <div class="footer">
        <span><i class="fas fa-shield-alt"></i> 24/7</span>
        <a href="#" id="whatsappLink"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="#" id="telegramLink"><i class="fab fa-telegram-plane"></i> Telegram</a>
        <span><i class="fas fa-language"></i> Any language</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== DOM =====
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const langLabel = document.getElementById('langLabel');

        // ===== API =====
        const API_URL = 'http://de3.bot-hosting.net:21007/kilwa-claude';

        // ===== ডকুমেন্টেশন =====
        const DOCUMENTATION = `
=== CYBER TOOLS APP – COMPLETE GUIDE ===

🔹 HOME PAGE (index.html)
• Tools: Device Info, News Generator, Age Calculator, Day Finder, URL Shortener, QR Code Scan/Gen, Style Name/Text Generator, Free Host file.
• Categories: Network, Security, Web, System.
• Drawer: My Profile, VIP Menu, About Us, Contact, Share App.
• Bottom Nav: Home, VIP Tools, Popular.

🔹 VIP UNLOCK (vip.html)
• Enter your registered Name and VIP Key.
• VIP Key is pre-generated and stored in Firebase.
• Users CANNOT generate keys themselves – they must contact the developer.
• To get a VIP Key, contact the developer Arif via WhatsApp or Telegram.
• On success → localStorage vip_status = 'active'
• VIP expiry: lifetime or specific date.

🔹 VIP TOOLS (vip-tools.html)
• Premium Apps, IP Tracker, Cyber bomber, Cyber Phish, Telegram Tracker, Cyber SPY.
• If not VIP → shows "Access Denied" popup and redirects to vip.html.

🔹 SETTINGS (settings.html)
• View your VIP credentials.
• Delete account → stores in deleted_accounts with expiry. Only admin (Arif) can reactivate.

🔹 SHARE APP (share-app.html)
• This page is already inside the app. Users do NOT need an external download link.
• If user asks for download link, tell them they are already inside the app.

🔹 JOIN COMMUNITY (join-channel.html)
• WhatsApp Group: https://chat.whatsapp.com/Gu9rE3yaSDnCJutYOKPUME
• YouTube Channel: https://youtube.com/@hackingcyber-q4s
• These are official community channels for support, updates, and tutorials.

🔹 DEVELOPER INFO (dev-info.html)
• Name: Arif
• Title: System Creator & Admin
• Bio: Hello! I am Arif. A passionate technology enthusiast and full-stack developer. I specialize in cybersecurity, modern web architectures, and custom application development.
• Skills: Ethical Hacking, Web Designer, App Development, Video Editor
• Security Signature: ARIF

🔹 SUPPORT
• There is NO support team. Only the developer Arif handles everything.
        `;

        // ===== স্টেট =====
        let isTyping = false;

        // ===== ভাষা ডিটেক্ট (হিংলিশ সহ) =====
        function detectLanguage(text) {
            // বাংলা
            if (/[\u0980-\u09FF]/.test(text)) return 'বাংলা';
            // হিন্দি (দেবনাগরী)
            if (/[\u0900-\u097F]/.test(text)) return 'हिन्दी';
            // আরবি/উর্দু
            if (/[\u0600-\u06FF]/.test(text)) return 'العربية/اردو';
            // হিংলিশ চেক – রোমান লিপিতে হিন্দি শব্দ
            const hinglishWords = ['kya', 'hai', 'nahi', 'aap', 'hum', 'tum', 'main', 'kaise', 'kyon', 'ho', 'hain', 'tha', 'thi', 'the', 'raha', 'rahi', 'rahe', 'sakta', 'sakti', 'sakte', 'chahiye', 'mil', 'de', 'le', 'kar', 'ko', 'se', 'mein', 'pe', 'ki', 'ka', 'ke', 'ne', 'bhi', 'hi', 'to', 'nahi', 'haan', 'ji', 'sir', 'madam', 'apka', 'apko', 'mera', 'tera', 'uska', 'unki', 'inke', 'jiska', 'jiski'];
            const words = text.toLowerCase().split(/\s+/);
            let hinglishScore = 0;
            for (let w of words) {
                // clean punctuation
                w = w.replace(/[^a-z]/g, '');
                if (hinglishWords.includes(w)) hinglishScore++;
            }
            if (hinglishScore >= 2) return 'Hinglish';
            // ইংরেজি (ডিফল্ট)
            return 'English';
        }

        // ===== মেসেজ যোগ =====
        function addMessage(text, sender, time = null) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            const now = time || new Date();
            const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
            div.innerHTML = text + `<div class="time"><i class="far fa-clock"></i> ${timeStr}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div;
        }

        // ===== টাইপিং =====
        function showTyping() {
            if (isTyping) return;
            isTyping = true;
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = `<span>Typing</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
            isTyping = false;
        }

        // ===== API কল =====
        async function getAIResponse(question) {
            const fullPrompt = `
You are the "Cyber Tools" support agent for the Cyber Tools app.

**Your role:**
- Answer questions about the app: features, VIP, tools, settings, account, sharing, and community links.
- If the user asks about groups or channels, provide the WhatsApp Group and YouTube Channel links from the documentation.
- If the user talks about hacking or illegal activities, politely say:
  "I am the Cyber Tools support agent. I only assist with app-related questions. Please ask about app features."

**Language Rules:**
- Respond in the EXACT same language the user used.
- If the user writes in Hinglish (Hindi in Latin script), respond in Hinglish.
- If the user writes in Bengali, respond in Bengali.
- If the user writes in Hindi (Devanagari), respond in Hindi.
- If the user writes in English, respond in English.
- If the user writes in Arabic/Urdu, respond in that language.

**Documentation:**
${DOCUMENTATION}

User question: ${question}
            `.trim();

            const url = `${API_URL}?text=${encodeURIComponent(fullPrompt)}`;
            const res = await fetch(url);
            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`HTTP ${res.status} – ${errText.slice(0, 50)}`);
            }
            const data = await res.json();
            if (data.status && data.status === 'error') {
                throw new Error(data.message || 'Service error');
            }
            return data.reply || data.response || JSON.stringify(data);
        }

        // ===== হ্যান্ডেল সেন্ড =====
        async function handleSend() {
            const question = userInput.value.trim();
            if (!question) return;

            const lang = detectLanguage(question);
            langLabel.textContent = lang;

            addMessage(question, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            showTyping();

            try {
                const reply = await getAIResponse(question);
                hideTyping();
                const formatted = reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                addMessage(formatted, 'bot');
            } catch (err) {
                hideTyping();
                const errorMsg = '⚠️ Service temporarily unavailable. Please try again.';
                addMessage(errorMsg, 'bot');
                console.error('API Error:', err);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            }
        }

        // ===== ক্লিয়ার =====
        function clearChat() {
            chatWindow.innerHTML = '';
            const welcome = document.createElement('div');
            welcome.className = 'msg bot';
            welcome.innerHTML = `👋 Chat cleared. Ask a new question.<div class="time"><i class="far fa-clock"></i> Now</div>`;
            chatWindow.appendChild(welcome);
            langLabel.textContent = 'English';
        }

        // ===== ইভেন্ট =====
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        clearBtn.addEventListener('click', clearChat);

        // ===== লিংক =====
        document.getElementById('whatsappLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.open('https://wa.me/917865875762?text=Support+needed', '_blank');
        });
        document.getElementById('telegramLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.open('https://t.me/your_support', '_blank');
        });

        console.log('✅ Cyber Tools Support ready (Hinglish support added)');
    })();
</script>
</body>
</html>
