<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium URL Shortener</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root { 
            --accent: #00ff41; 
            --bg: #000000; 
            --card: #121212; 
            --border: #222222;
            --text-muted: #888888; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: #fff; display: flex; flex-direction: column; min-height: 100vh; }

        /* Header Setup */
        header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 15px 20px; 
            background: #000; 
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 1px; }

        /* Main Container */
        .container { padding: 25px 20px; flex: 1; max-width: 480px; margin: 0 auto; width: 100%; }

        .info-box {
            background: rgba(0, 255, 65, 0.03);
            border: 1px dashed var(--accent);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .info-box i { color: var(--accent); font-size: 1.1rem; margin-top: 2px; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: var(--text-muted); font-size: 1.1rem; }
        
        .input-group input { 
            width: 100%; 
            background: var(--card); 
            border: 1px solid var(--border); 
            padding: 14px 15px 14px 45px; 
            border-radius: 12px; 
            color: #fff; 
            outline: none; 
            font-size: 0.9rem; 
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }

        .action-btn { 
            width: 100%; 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 0.95rem; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Result Section */
        .result-area { 
            margin-top: 30px; 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            padding: 20px; 
            display: none; 
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-title { font-size: 0.8rem; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px; }
        
        .output-box {
            display: flex;
            background: #000;
            border: 1px solid #222;
            padding: 12px 15px;
            border-radius: 10px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .output-box span { font-size: 0.9rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
        .copy-btn { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 1.1rem; padding: 5px; }

        /* QR Code Option */
        .qr-section { text-align: center; border-top: 1px solid #222; padding-top: 15px; margin-top: 15px; }
        .qr-section p { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; }
        .qr-img { background: #fff; padding: 8px; border-radius: 10px; display: inline-block; }
        .qr-img img { display: block; width: 120px; height: 120px; }

        /* Loader Style */
        .spinner { border: 2px solid #000; border-top: 2px solid #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <a href="../index.html"><i class="fas fa-arrow-left"></i></a>
        <h1>URL SHORTENER</h1>
        <div style="width: 20px;"></div>
    </header>

    <div class="container">
        <div class="info-box">
            <i class="fas fa-circle-info"></i>
            <span>যেকোনো বড় লং লিঙ্ক বা ইউআরএল (URL) এখানে পেস্ট করে এক ক্লিকে সেটিকে অত্যন্ত ছোট এবং প্রফেশনাল লিঙ্কে রূপান্তর করে নিন।</span>
        </div>

        <div class="input-group">
            <i class="fas fa-link"></i>
            <input type="url" id="longUrl" placeholder="আপনার বড় লিঙ্কটি এখানে পেস্ট করুন...">
        </div>

        <button class="action-btn" id="shortenBtn" onclick="generateShortUrl()">
            <span class="spinner" id="btnLoader"></span>
            <span id="btnText"><i class="fas fa-bolt"></i> Shorten URL</span>
        </button>

        <div class="result-area" id="resultArea">
            <div class="result-title">SHORTENED LINK</div>
            <div class="output-box">
                <span id="shortenedUrl">https://is.gd/xyz123</span>
                <button class="copy-btn" onclick="copyLink()" title="Copy Link"><i class="far fa-copy" id="copyIcon"></i></button>
            </div>

            <div class="qr-section">
                <p>Scan this QR code to open the short link</p>
                <div class="qr-img">
                    <img id="qrCodeImg" src="" alt="QR Code">
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateShortUrl() {
            const longUrlInput = document.getElementById('longUrl').value.trim();
            const shortenBtn = document.getElementById('shortenBtn');
            const btnLoader = document.getElementById('btnLoader');
            const btnText = document.getElementById('btnText');
            const resultArea = document.getElementById('resultArea');
            const shortenedUrlText = document.getElementById('shortenedUrl');
            const qrCodeImg = document.getElementById('qrCodeImg');

            // লিঙ্ক ভ্যালিডেশন চেক
            if (!longUrlInput) {
                alert("দয়া করে প্রথমে একটি সঠিক লিঙ্ক পেস্ট করুন!");
                return;
            }

            if (!longUrlInput.startsWith('http://') && !longUrlInput.startsWith('https://')) {
                alert("দয়া করে একটি সম্পূর্ণ লিঙ্ক পেস্ট করুন (যেমন: https://google.com)");
                return;
            }

            // লোডার স্টার্ট
            shortenBtn.disabled = true;
            btnLoader.style.display = "inline-block";
            btnText.style.display = "none";

            try {
                //is.gd ফ্রিতে রিয়েল-টাইম কাজ করা ক্রস-অরিজিন API ব্যবহার করা হয়েছে
                const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrlInput)}`);
                const data = await response.json();

                if (data.shorturl) {
                    // রেজাল্ট দেখানো
                    shortenedUrlText.innerText = data.shorturl;
                    
                    // ফ্রিতে কিউআর কোড ইমেজ জেনারেট করার এপিআই
                    qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.shorturl)}`;
                    
                    resultArea.style.display = "block";
                } else if (data.errormessage) {
                    alert("API Error: " + data.errormessage);
                } else {
                    alert("লিঙ্কটি শর্ট করতে সমস্যা হচ্ছে। আবার চেষ্টা করুন।");
                }
            } catch (error) {
                console.error(error);
                alert("নেটওয়ার্ক সমস্যা! দয়া করে আপনার ইন্টারনেট কানেকশন চেক করুন।");
            } finally {
                // লোডার স্টপ
                shortenBtn.disabled = false;
                btnLoader.style.display = "none";
                btnText.style.display = "inline-block";
            }
        }

        // লিঙ্ক ওয়ান-ক্লিক কপি লজিক
        function copyLink() {
            const urlText = document.getElementById('shortenedUrl').innerText;
            const copyIcon = document.getElementById('copyIcon');

            navigator.clipboard.writeText(urlText).then(() => {
                // কপি হওয়ার পর আইকন চেঞ্জ করে টিকচিহ্ন দেওয়া
                copyIcon.className = "fas fa-check";
                copyIcon.style.color = "#00ff41";
                
                alert("লিঙ্কটি কপি করা হয়েছে!");

                // ২ সেকেন্ড পর আবার আগের আইকন ফিরিয়ে আনা
                setTimeout(() => {
                    copyIcon.className = "far fa-copy";
                    copyIcon.style.color = "var(--accent)";
                }, 2000);
            }).catch(err => {
                alert("কপি করা যায়নি, ম্যানুয়ালি কপি করুন।");
            });
        }
    </script>
</body>
</html>
