            --text-muted: #8899aa;
            --radius: 16px;
        }

        .input-area { background: rgba(18, 22, 28, 0.7); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.45); }

        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,245,160,0.4); }
        .counter { margin-top: 14px; font-size: 0.8rem; color: var(--text-muted); text-align: right; border-top: 1px solid var(--border); padding-top: 12px; }

        .style-card .sno { color: var(--text-muted); font-size: 0.7rem; font-weight: 700; min-width: 32px; opacity: 0.6; }
        .style-card .sname { color: var(--text-muted); font-size: 0.72rem; font-weight: 600; min-width: 100px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.8; }
        .style-card .svalue { flex: 1; font-size: 1rem; color: #fff; word-break: break-all; line-height: 1.5; }
        .style-card .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 30px; cursor: pointer; transition: 0.2s; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .style-card .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,245,160,0.06); }
        .style-card .copy-btn.copied { border-color: var(--accent); color: #000; background: var(--accent); }

        .style-card { animation: fadeSlide 0.3s ease forwards; opacity: 0; transform: translateY(6px); }
        @keyframes fadeSlide { to { opacity: 1; transform: translateY(0); } }
        .style-card:nth-child(1) { animation-delay: 0.02s; }
        .style-card:nth-child(2) { animation-delay: 0.04s; }
        .style-card:nth-child(3) { animation-delay: 0.06s; }
        .style-card:nth-child(4) { animation-delay: 0.08s; }

        }

</head>

// ===== GENERATE =====
function generateStyles() {
    const input = document.getElementById('nameInput').value.trim();
    if (!input) { alert('Please enter a name or text!'); return; }

    const grid = document.getElementById('styleGrid');
    grid.innerHTML = '';

    styleTemplates.forEach((style, idx) => {
        const fontFn = fancyFonts[style.font] || ((s) => s);
        const styledName = fontFn(input);
        const finalText = `${style.prefix} ${styledName} ${style.suffix}`;

        const card = document.createElement('div');
        card.className = 'style-card';
        card.dataset.styleName = style.name.toLowerCase();

        const sno = document.createElement('span');
        sno.className = 'sno';
        sno.textContent = `#${String(idx + 1).padStart(2, '0')}`;

        const sname = document.createElement('span');
        sname.className = 'sname';
        sname.textContent = style.name;

        const svalue = document.createElement('span');
        svalue.className = 'svalue';
        svalue.textContent = finalText;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        copyBtn.onclick = function(e) {
            e.stopPropagation();
            navigator.clipboard.writeText(finalText).then(() => {
                this.classList.add('copied');
                this.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    this.classList.remove('copied');
                    this.innerHTML = '<i class="fas fa-copy"></i> Copy';
                }, 2000);
            }).catch(() => alert('Unable to copy. Please select manually.'));
        };

        card.appendChild(sno);
        card.appendChild(sname);
        card.appendChild(svalue);
        card.appendChild(copyBtn);
        grid.appendChild(card);
    });

    document.getElementById('totalCount').textContent = styleTemplates.length;
    document.getElementById('filterInput').value = '';
}

// ===== FILTER =====
function filterStyles() {
    const query = document.getElementById('filterInput').value.toLowerCase().trim();
    const cards = document.querySelectorAll('.style-card');
    let visible = 0;
    cards.forEach(card => {
        const name = card.dataset.styleName || '';
        const matches = name.includes(query);
        card.style.display = matches ? 'flex' : 'none';
        if (matches) visible++;
    });
    document.getElementById('totalCount').textContent = visible;
}

// ===== ENTER KEY =====
document.getElementById('nameInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') generateStyles();
});

// ===== AUTO-GENERATE =====
window.onload = generateStyles;
</script>
