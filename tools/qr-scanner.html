<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium QR & Barcode Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root { 
            --accent: #00ff41; 
            --bg: #000000; 
            --card: #121212; 
            --border: #222222;
            --text-muted: #888888; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: #fff; display: flex; flex-direction: column; min-height: 100vh; }

        /* Header Setup */
        header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 15px 20px; 
            background: #000; 
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 1px; }

        /* Main Container */
        .container { padding: 20px; flex: 1; max-width: 480px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }

        /* Gallery Upload Button */
        .upload-zone {
            background: var(--card);
            border: 2px dashed #333;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-zone:hover { border-color: var(--accent); background: rgba(0, 255, 65, 0.02); }
        .upload-zone i { color: var(--accent); font-size: 1.4rem; margin-bottom: 6px; display: block; }
        .upload-zone span { font-size: 0.85rem; color: #ccc; font-weight: 500; }
        .upload-zone p { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
        #imageInput { display: none; }

        .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1c1c1c; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        /* Scanner Camera Viewport */
        .scanner-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.03);
        }
        
        #reader {
            width: 100% !important;
            border: none !important;
            background: #000;
        }

        /* Html5-qrcode লাইব্রেরির কাস্টম ডিজাইন */
        #reader button {
            background: var(--accent) !important;
            color: #000 !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-weight: 700 !important;
            font-size: 0.85rem !important;
            cursor: pointer !important;
            margin: 10px 0 !important;
            text-transform: uppercase;
        }
        #reader select {
            background: #222 !important;
            color: #fff !important;
            border: 1px solid #444 !important;
            padding: 8px !important;
            border-radius: 8px !important;
            margin: 10px 0 !important;
            outline: none;
        }

        .scan-window-hint {
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid #1c1c1c;
            background: #111;
        }

        /* Result Section */
        .result-area { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            padding: 20px; 
            display: none; 
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-title { font-size: 0.8rem; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 12px; }
        
        .output-box {
            background: #000;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #fff;
            word-break: break-all;
            line-height: 1.5;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .btn-group { display: flex; gap: 10px; }
        .action-btn { 
            flex: 1;
            background: #222; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .action-btn.primary {
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 700;
        }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <header>
        <a href="../index.html"><i class="fas fa-arrow-left"></i></a>
        <h1>QR & BARCODE SCANNER</h1>
        <div style="width: 20px;"></div>
    </header>

    <div class="container">
        
        <div class="upload-zone" onclick="document.getElementById('imageInput').click()">
            <i class="fas fa-images"></i>
            <span>Upload from Gallery</span>
            <p>ডাউনলোড করা QR কোডের ছবি সিলেক্ট করুন</p>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="divider">OR USE LIVE CAMERA</div>

        <div class="scanner-card">
            <div id="reader"></div>
            <div class="scan-window-hint">
                <i class="fas fa-expand"></i> কোডটি ক্যামেরার সামনে সোজা করে ধরুন
            </div>
        </div>

        <div class="result-area" id="resultArea">
            <div class="result-title"><i class="fas fa-square-poll-horizontal"></i> SCAN RESULT</div>
            <div class="output-box" id="resultText">এখানে স্ক্যান করা ডাটা দেখা যাবে...</div>

            <div class="btn-group">
                <button class="action-btn" onclick="copyResult()">
                    <i class="far fa-copy" id="copyIcon"></i> Copy Text
                </button>
                <button class="action-btn primary" id="openLinkBtn" onclick="openLink()" style="display: none;">
                    <i class="fas fa-external-link-alt"></i> Open Website
                </button>
            </div>
        </div>
    </div>

    <script>
        let html5QrcodeScanner;
        let html5QrCodeObject; // ফাইল স্ক্যান করার অবজেক্ট
        let scannedResultData = "";

        // স্ক্যান সফল হলে এই ফাংশনটি রান করবে (ক্যামেরা ও গ্যালারি দুইটার জন্যই)
        function handleScanSuccess(decodedText) {
            scannedResultData = decodedText;
            
            const resultArea = document.getElementById('resultArea');
            const resultText = document.getElementById('resultText');
            const openLinkBtn = document.getElementById('openLinkBtn');

            resultText.innerText = decodedText;
            resultArea.style.display = "block";
            
            // স্ক্রোল করে রেজাল্ট সেকশনে নিয়ে যাওয়া
            resultArea.scrollIntoView({ behavior: 'smooth' });

            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                openLinkBtn.style.display = "flex";
            } else {
                openLinkBtn.style.display = "none";
            }
        }

        // ক্যামেরা ইনিশিয়ালাইজেশন
        window.addEventListener('DOMContentLoaded', () => {
            // লাইভ ক্যামেরা স্ক্যানার চালু করা
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 15, qrbox: { width: 230, height: 230 }, rememberLastUsedCamera: true }, false
            );
            html5QrcodeScanner.render(handleScanSuccess, (err) => {});

            // গ্যালারি ফাইল স্ক্যান করার অবজেক্ট ব্যাকএন্ডে রেডি রাখা
            html5QrCodeObject = new Html5QrCode("reader");
            
            // গ্যালারি ইনপুট ফাইল লিসেনার
            document.getElementById('imageInput').addEventListener('change', e => {
                if (e.target.files.length == 0) return;
                
                const imageFile = e.target.files[0];
                
                // ইমেজ ফাইল থেকে QR কোড স্ক্যান করার রিয়েল-টাইম মেথড
                html5QrCodeObject.scanFile(imageFile, true)
                .then(decodedText => {
                    handleScanSuccess(decodedText);
                })
                .catch(err => {
                    alert("❌ এই ছবিতে কোনো সঠিক QR বা বারকোড পাওয়া যায়নি! দয়া করে পরিষ্কার ছবি আপলোড করুন।");
                });
            });
        });

        // ওয়ান-ক্লিক কপি লজিক
        function copyResult() {
            if (!scannedResultData) return;
            const copyIcon = document.getElementById('copyIcon');

            navigator.clipboard.writeText(scannedResultData).then(() => {
                copyIcon.className = "fas fa-check";
                copyIcon.style.color = "#00ff41";
                alert("ডাটা ক্লিপবোর্ডে কপি করা হয়েছে!");
                setTimeout(() => {
                    copyIcon.className = "far fa-copy";
                    copyIcon.style.color = "#fff";
                }, 2000);
            }).catch(err => {
                alert("কপি করা যায়নি!");
            });
        }

        // লিঙ্ক ওপেন করার লজিক
        function openLink() {
            if (scannedResultData.startsWith('http://') || scannedResultData.startsWith('https://')) {
                window.open(scannedResultData, '_blank');
            }
        }
    </script>
</body>
</html>
