        /* ====== Day-Finder Inspired Theme ====== */
        :root {
            --accent: #00ff41;
            --bg: #000;
            --card: #0a0a0a;
            --border: #222;
            --text: #fff;
            --dim: #aaa;
            --muted: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }

        /* ====== Header ====== */
        .header {
            display: flex;
            align-items: center;
            text-align: left;
            margin-bottom: 20px;
        }
        .header a {
            color: var(--accent);
            font-size: 1.5rem;
            margin-right: 20px;
            text-decoration: none;
        }
        .header h2 {
            font-size: 1.3rem;
            color: var(--text);
        }

        /* ====== Description Box ====== */
        .info-note {
            background: #111;
            border: 1px dashed var(--accent);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: var(--dim);
            line-height: 1.4;
        }

        /* ====== Main Container ====== */
        .container {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            width: 95%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .container h1 {
            font-size: 1.5rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.15);
        }

        /* ====== Form Groups ====== */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .form-group label i {
            margin-right: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            color-scheme: dark;
            appearance: auto;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.2);
        }
        .form-group select option {
            background: #000;
            color: var(--text);
        }

        /* ====== Buttons ====== */
        .search-btn {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .search-btn:hover {
            background: #00cc33;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.25);
        }

        /* ====== Result Section ====== */
        .result-section {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
            width: 95%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-section .result-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-section .result-item:last-child {
            border-bottom: none;
        }

        .result-item .label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-item .value {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: bold;
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.15);
        }
        .result-item .value.blink {
            animation: blink 1s infinite;
        }

        .result-item .value-sm {
            font-size: 1.1rem;
        }

        .result-item .value-gold {
            color: gold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
        }

        /* ====== Social Share Buttons ====== */
        #socialShare {
            display: none;
            margin-top: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        #socialShare button {
            flex: 1;
            min-width: 80px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        #socialShare button:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* ====== Clock ====== */
        #clock {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
        #clock i {
            color: var(--accent);
            margin-right: 6px;
        }

        /* ====== Developer Footer ====== */
        .dev-footer {
            margin-top: auto;
            padding: 15px;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 1px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }
        .dev-footer i {
            color: var(--accent);
        }

        /* ====== Animations ====== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%,
            50%,
            100% {
                opacity: 1;
            }
            25%,
            75% {
                opacity: 0;
            }
        }

            .result-item .value {
                font-size: 1.2rem;
            }
            #socialShare button {
                font-size: 0.75rem;
                padding: 8px;
            }
        }

        }

        function getZodiacEmoji(index) {
            const emojis = ['', '', '', '', '', '', '', '', '', '', '', ''];
            return emojis[index % emojis.length] || '';
        }

        function getLifeAdviceText(age) {
            const lang = getLang();
            const advice = LANG[lang]?.advice ?? LANG.en.advice;
            if (age < 13) return advice.child;
            if (age < 20) return advice.teen;
            if (age < 30) return advice.young;
            if (age < 50) return advice.mid;
            return advice.senior;
        }

        function getFunFactText(date) {
            const lang = getLang();
            const facts = LANG[lang]?.facts ?? LANG.en.facts;
            return facts[date.getDate() % facts.length] || facts[0];
        }

        function getAgeText(y, m, d) {
            const lang = getLang();
            const fn = LANG[lang]?.ageText ?? LANG.en.ageText;
            return fn(y, m, d);
        }

        function getLuckyNumber(d) {
            let str = d.getDate().toString().padStart(2, '0') +
                (d.getMonth() + 1).toString().padStart(2, '0') +
                d.getFullYear().toString();
            let s = 0;
            for (let c of str) s += parseInt(c);
            while (s >= 10) {
                s = s.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            }
            return s;
        }

        // ============================================================
        //  UPDATE UI LANGUAGE
        // ============================================================
        function updateUIText() {
            const lang = getLang();

            // Static UI
            elements.appTitle.textContent = t('appTitle');
            elements.infoNoteStrong.textContent = t('infoNoteStrong');
            elements.infoNoteText.textContent = t('infoNoteText');
            elements.mainTitle.innerHTML =
                `<i class="fas fa-calculator" style="color: var(--accent);"></i> ${t('mainTitle')}`;
            elements.birthdateLabel.innerHTML = `<i class="fas fa-calendar-alt"></i> ${t('birthdateLabel')}`;
            elements.languageLabel.innerHTML = `<i class="fas fa-language"></i> ${t('languageLabel')}`;
            elements.musicLabel.innerHTML = `<i class="fas fa-music"></i> ${t('musicLabel')}`;

            // Music dropdown options
            const musicOpts = elements.musicSelect.options;
            musicOpts[0].textContent = t('musicOff');
            musicOpts[1].textContent = t('musicOn');

            elements.calculateBtn.innerHTML = `<i class="fas fa-search"></i> ${t('calculateBtn')}`;
            elements.shareBtn.innerHTML = `<i class="fas fa-share-alt"></i> ${t('shareBtn')}`;
            elements.whatsappBtn.innerHTML = `<i class="fab fa-whatsapp"></i> ${t('whatsappBtn')}`;
            elements.facebookBtn.innerHTML = `<i class="fab fa-facebook"></i> ${t('facebookBtn')}`;

            elements.resultAgeLabel.innerHTML = `<i class="fas fa-user"></i> ${t('resultAgeLabel')}`;
            elements.resultZodiacLabel.innerHTML = `<i class="fas fa-dragon"></i> ${t('resultZodiacLabel')}`;
            elements.resultLuckyLabel.innerHTML = `<i class="fas fa-star"></i> ${t('resultLuckyLabel')}`;
            elements.resultAdviceLabel.innerHTML = `<i class="fas fa-lightbulb"></i> ${t('resultAdviceLabel')}`;
            elements.resultFunFactLabel.innerHTML = `<i class="fas fa-smile"></i> ${t('resultFunFactLabel')}`;

            elements.footerText.innerHTML = `<i class="fas fa-code"></i> ${t('footerText')}`;

            // If results are visible, re-render them with new language
            if (elements.resultSection.style.display === 'block' && lastCalculated) {
                renderResults(lastCalculated);
            }
        }

        // ============================================================
        //  RENDER RESULTS
        // ============================================================
        function renderResults(data) {
            const { y, m, d, dob, zodiacIdx } = data;
            const lang = getLang();

            elements.resultAge.textContent = getAgeText(y, m, d);
            elements.chineseZodiac.textContent = `${getZodiacName(zodiacIdx)} ${getZodiacEmoji(zodiacIdx)}`;
            elements.luckyNumber.textContent = getLuckyNumber(dob);
            elements.lifeAdvice.textContent = getLifeAdviceText(y);
            elements.funFact.textContent = getFunFactText(dob);

            elements.resultSection.style.display = 'block';
        }

        // ============================================================
        //  CALCULATE AGE
        // ============================================================
        function calculateAge() {
            const v = elements.dob.value;
            if (!v) {
                alert(t('alertSelectDate'));
                return;
            }

            const dob = new Date(v);
            const t = new Date();

            let Y = t.getFullYear() - dob.getFullYear();
            let M = t.getMonth() - dob.getMonth();
            let D = t.getDate() - dob.getDate();
            if (D < 0) { M--;
                D += new Date(t.getFullYear(), t.getMonth(), 0).getDate(); }
            if (M < 0) { Y--;
                M += 12; }

            const zodiacIdx = dob.getFullYear() % 12;

            // Store data for re-render
            lastCalculated = { y: Y, m: M, d: D, dob, zodiacIdx };

            renderResults(lastCalculated);

            // Birthday celebration
            if (dob.getDate() === t.getDate() && dob.getMonth() === t.getMonth()) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                alert(t('alertHappyBirthday'));
            }
        }

        // ============================================================
        //  CLOCK
        // ============================================================
        function updateClock() {
            const now = new Date();
            const lang = getLang();
            let options;
            if (lang === 'bn') {
                options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            } else if (lang === 'hi') {
                options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            } else {
                options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            }
            const dateStr = now.toLocaleDateString(lang === 'en' ? 'en-US' : lang === 'bn' ? 'bn-BD' : 'hi-IN', options);
            const timeStr = now.toLocaleTimeString(lang === 'en' ? 'en-US' : lang === 'bn' ? 'bn-BD' : 'hi-IN');
            elements.clockText.textContent = `${dateStr} ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        //  MUSIC
        // ============================================================
        function toggleMusic(val) {
            const m = document.getElementById('bgMusic');
            if (val === 'on') {
                m.play().catch(() => alert('Tap somewhere to enable sound!'));
            } else {
                m.pause();
                m.currentTime = 0;
            }
        }

        // ============================================================
        //  SOCIAL SHARE
        // ============================================================
        function toggleShare() {
            const el = document.getElementById('socialShare');
            el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'flex' : 'none';
        }

        function getShareText() {
            const lang = getLang();
            const age = elements.resultAge.textContent;
            const zodiac = elements.chineseZodiac.textContent;
            const lucky = elements.luckyNumber.textContent;
            const advice = elements.lifeAdvice.textContent;
            const fact = elements.funFact.textContent;
            const labels = LANG[lang] ?? LANG.en;
            return ` ${labels.resultAgeLabel}: ${age}\n ${labels.resultZodiacLabel}: ${zodiac}\n ${labels.resultLuckyLabel}: ${lucky}\n ${labels.resultAdviceLabel}: ${advice}\n ${labels.resultFunFactLabel}: ${fact}`;
        }

        function shareWhatsApp() {
            const text = encodeURIComponent(getShareText());
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function shareFacebook() {
            const text = encodeURIComponent(getShareText());
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank');
        }

        // ============================================================
        //  LANGUAGE CHANGE HANDLER
        // ============================================================
        elements.language.addEventListener('change', function() {
            currentLang = this.value;
            updateUIText();
            updateClock(); // refresh clock with new locale
        });

        // ============================================================
        //  SET DEFAULT DATE
        // ============================================================
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            elements.dob.value = today;

            // Set default language to English
            elements.language.value = 'en';
            currentLang = 'en';
            updateUIText();
            updateClock();
        };
    </script>

</body>
</html>
