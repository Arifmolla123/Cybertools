<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>🎯 Age Calculator</title>

    <style>
        /* ====== Day-Finder Inspired Theme ====== */
        :root {
            --accent: #00ff41;
            --bg: #000;
            --card: #0a0a0a;
            --border: #222;
            --text: #fff;
            --dim: #aaa;
            --muted: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            text-align: left;
            margin-bottom: 20px;
        }
        .header a {
            color: var(--accent);
            font-size: 1.5rem;
            margin-right: 20px;
            text-decoration: none;
        }
        .header h2 {
            font-size: 1.3rem;
            color: var(--text);
        }

        .info-note {
            background: #111;
            border: 1px dashed var(--accent);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: var(--dim);
            line-height: 1.4;
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            width: 95%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .container h1 {
            font-size: 1.5rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.15);
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .form-group label i {
            margin-right: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            color-scheme: dark;
            appearance: auto;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.2);
        }
        .form-group select option {
            background: #000;
            color: var(--text);
        }

        .search-btn {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .search-btn:hover {
            background: #00cc33;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.25);
        }

        .result-section {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
            width: 95%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-section .result-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-section .result-item:last-child {
            border-bottom: none;
        }

        .result-item .label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-item .value {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: bold;
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.15);
        }
        .result-item .value.blink {
            animation: blink 1s infinite;
        }
        .result-item .value-sm {
            font-size: 1.1rem;
        }
        .result-item .value-gold {
            color: gold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
        }

        #socialShare {
            display: none;
            margin-top: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        #socialShare button {
            flex: 1;
            min-width: 80px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        #socialShare button:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        #clock {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
        #clock i {
            color: var(--accent);
            margin-right: 6px;
        }

        .dev-footer {
            margin-top: auto;
            padding: 15px;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 1px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }
        .dev-footer i {
            color: var(--accent);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes blink {
            0%,
            50%,
            100% {
                opacity: 1;
            }
            25%,
            75% {
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 16px;
            }
            .container h1 {
                font-size: 1.2rem;
            }
            .form-group input,
            .form-group select {
                padding: 10px;
                font-size: 0.9rem;
            }
            .search-btn,
            .btn-secondary {
                padding: 12px;
                font-size: 0.85rem;
            }
            .result-item .value {
                font-size: 1.2rem;
            }
            #socialShare button {
                font-size: 0.75rem;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ====== HEADER ====== -->
    <div class="header">
        <a href="#" onclick="window.history.back(); return false;"><i class="fas fa-arrow-left"></i></a>
        <h2 id="appTitle">Age Calculator</h2>
    </div>

    <!-- ====== INFO NOTE ====== -->
    <div class="info-note">
        <i class="fas fa-cake-candles" style="color: var(--accent);"></i>
        <strong id="infoNoteStrong">Age Calculator:</strong>
        <span id="infoNoteText">Select your birthdate and find out your age, zodiac, lucky number and more in one click!</span>
    </div>

    <!-- ====== CLOCK ====== -->
    <div id="clock"><i class="fas fa-clock"></i> <span id="clockText"></span></div>

    <!-- ====== MAIN CONTAINER ====== -->
    <div class="container">
        <h1 id="mainTitle"><i class="fas fa-calculator" style="color: var(--accent);"></i> Age Calculator</h1>

        <div class="form-group">
            <label id="birthdateLabel"><i class="fas fa-calendar-alt"></i> Select your birthdate</label>
            <input type="date" id="dob" />
        </div>

        <div class="form-group">
            <label id="languageLabel"><i class="fas fa-language"></i> Select Language</label>
            <select id="language">
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <button class="search-btn" id="calculateBtn" onclick="calculateAge()">
            <i class="fas fa-search"></i> <span id="calcBtnText">Calculate Age</span>
        </button>

        <button class="btn-secondary" id="shareBtn" onclick="toggleShare()">
            <i class="fas fa-share-alt"></i> <span id="shareBtnText">Share Result</span>
        </button>

        <div id="socialShare">
            <button id="whatsappBtn" onclick="shareWhatsApp()"><i class="fab fa-whatsapp"></i> WhatsApp</button>
            <button id="facebookBtn" onclick="shareFacebook()"><i class="fab fa-facebook"></i> Facebook</button>
        </div>
    </div>

    <!-- ====== RESULT SECTION ====== -->
    <div class="result-section" id="resultSection">
        <div class="result-item">
            <div class="label" id="resultAgeLabel"><i class="fas fa-user"></i> Age</div>
            <div class="value" id="resultAge">—</div>
        </div>
        <div class="result-item">
            <div class="label" id="resultZodiacLabel"><i class="fas fa-dragon"></i> Chinese Zodiac</div>
            <div class="value value-sm" id="chineseZodiac">—</div>
        </div>
        <div class="result-item">
            <div class="label" id="resultLuckyLabel"><i class="fas fa-star"></i> Lucky Number</div>
            <div class="value blink" id="luckyNumber">—</div>
        </div>
        <div class="result-item">
            <div class="label" id="resultAdviceLabel"><i class="fas fa-lightbulb"></i> Life Advice</div>
            <div class="value value-sm value-gold" id="lifeAdvice">—</div>
        </div>
        <div class="result-item">
            <div class="label" id="resultFunFactLabel"><i class="fas fa-smile"></i> Fun Fact</div>
            <div class="value value-sm" id="funFact" style="color: #ccc;">—</div>
        </div>
    </div>

    <!-- ====== FOOTER ====== -->
    <div class="dev-footer" id="footerText">
        <i class="fas fa-code"></i> Age Calculator - Developer Arif
    </div>

            const emojis = ['🐀', '🐂', '🐅', '🐇', '🐉', '🐍', '🐎', '🐐', '🐒', '🐓', '🐕', '🐖'];
            return emojis[index % emojis.length] || '';
        }

        function getLifeAdviceText(age) {
            const advice = LANG[getLang()]?.advice ?? LANG.en.advice;
            if (age < 13) return advice.child;
            if (age < 20) return advice.teen;
            if (age < 30) return advice.young;
            if (age < 50) return advice.mid;
            return advice.senior;
        }

        function getFunFactText(date) {
            const facts = LANG[getLang()]?.facts ?? LANG.en.facts;
            return facts[date.getDate() % facts.length] || facts[0];
        }

        function getAgeText(y, m, d) {
            const fn = LANG[getLang()]?.ageText ?? LANG.en.ageText;
            return fn(y, m, d);
        }

        function getLuckyNumber(d) {
            let str = d.getDate().toString().padStart(2, '0') +
                (d.getMonth() + 1).toString().padStart(2, '0') +
                d.getFullYear().toString();
            let s = 0;
            for (let c of str) s += parseInt(c);
            while (s >= 10) {
                s = s.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            }
            return s;
        }

        // ============================================================
        //  UPDATE UI LANGUAGE
        // ============================================================
        function updateUIText() {
            els.appTitle.textContent = t('appTitle');
            els.infoNoteStrong.textContent = t('infoNoteStrong');
            els.infoNoteText.textContent = t('infoNoteText');
            els.mainTitle.innerHTML = `<i class="fas fa-calculator" style="color: var(--accent);"></i> ${t('mainTitle')}`;
            els.birthdateLabel.innerHTML = `<i class="fas fa-calendar-alt"></i> ${t('birthdateLabel')}`;
            els.languageLabel.innerHTML = `<i class="fas fa-language"></i> ${t('languageLabel')}`;
            els.calcBtnText.textContent = t('calcBtnText');
            els.shareBtnText.textContent = t('shareBtnText');
            els.whatsappBtn.innerHTML = `<i class="fab fa-whatsapp"></i> ${t('whatsappBtn')}`;
            els.facebookBtn.innerHTML = `<i class="fab fa-facebook"></i> ${t('facebookBtn')}`;
            els.resultAgeLabel.innerHTML = `<i class="fas fa-user"></i> ${t('resultAgeLabel')}`;
            els.resultZodiacLabel.innerHTML = `<i class="fas fa-dragon"></i> ${t('resultZodiacLabel')}`;
            els.resultLuckyLabel.innerHTML = `<i class="fas fa-star"></i> ${t('resultLuckyLabel')}`;
            els.resultAdviceLabel.innerHTML = `<i class="fas fa-lightbulb"></i> ${t('resultAdviceLabel')}`;
            els.resultFunFactLabel.innerHTML = `<i class="fas fa-smile"></i> ${t('resultFunFactLabel')}`;
            els.footerText.innerHTML = `<i class="fas fa-code"></i> ${t('footerText')}`;

            if (els.resultSection.style.display === 'block' && lastCalculated) {
                renderResults(lastCalculated);
            }
        }

        // ============================================================
        //  RENDER RESULTS
        // ============================================================
        function renderResults(data) {
            const { y, m, d, dob, zodiacIdx } = data;
            els.resultAge.textContent = getAgeText(y, m, d);
            els.chineseZodiac.textContent = `${getZodiacName(zodiacIdx)} ${getZodiacEmoji(zodiacIdx)}`;
            els.luckyNumber.textContent = getLuckyNumber(dob);
            els.lifeAdvice.textContent = getLifeAdviceText(y);
            els.funFact.textContent = getFunFactText(dob);
            els.resultSection.style.display = 'block';
        }

        // ============================================================
        //  CALCULATE AGE
        // ============================================================
        function calculateAge() {
            const v = els.dob.value;
            if (!v) {
                alert(t('alertSelectDate'));
                return;
            }
            const dob = new Date(v);
            const t = new Date();
            let Y = t.getFullYear() - dob.getFullYear();
            let M = t.getMonth() - dob.getMonth();
            let D = t.getDate() - dob.getDate();
            if (D < 0) { M--; D += new Date(t.getFullYear(), t.getMonth(), 0).getDate(); }
            if (M < 0) { Y--; M += 12; }
            const zodiacIdx = dob.getFullYear() % 12;
            lastCalculated = { y: Y, m: M, d: D, dob, zodiacIdx };
            renderResults(lastCalculated);

            if (dob.getDate() === t.getDate() && dob.getMonth() === t.getMonth()) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                alert(t('alertHappyBirthday'));
            }
        }

        // ============================================================
        //  CLOCK
        // ============================================================
        function updateClock() {
            const now = new Date();
            const lang = getLang();
            const locale = lang === 'bn' ? 'bn-BD' : lang === 'hi' ? 'hi-IN' : 'en-US';
            const dateStr = now.toLocaleDateString(locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString(locale);
            els.clockText.textContent = `${dateStr} ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        //  SOCIAL SHARE
        // ============================================================
        function toggleShare() {
            const el = document.getElementById('socialShare');
            el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'flex' : 'none';
        }

        function getShareText() {
            const lang = getLang();
            const labels = LANG[lang] ?? LANG.en;
            return `🎯 ${labels.resultAgeLabel}: ${els.resultAge.textContent}\n🐉 ${labels.resultZodiacLabel}: ${els.chineseZodiac.textContent}\n⭐ ${labels.resultLuckyLabel}: ${els.luckyNumber.textContent}\n💡 ${labels.resultAdviceLabel}: ${els.lifeAdvice.textContent}\n😊 ${labels.resultFunFactLabel}: ${els.funFact.textContent}`;
        }

        function shareWhatsApp() {
            const text = encodeURIComponent(getShareText());
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function shareFacebook() {
            const text = encodeURIComponent(getShareText());
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank');
        }

        // ============================================================
        //  LANGUAGE CHANGE HANDLER
        // ============================================================
        els.language.addEventListener('change', function() {
            updateUIText();
            updateClock();
        });

        // ============================================================
        //  INIT
        // ============================================================
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            els.dob.value = today;
            els.language.value = 'en';
            updateUIText();
            updateClock();
        };
    </script>
</body>
</html>
