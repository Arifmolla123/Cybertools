<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Cyber Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; background: #000; }

        #app-frame {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: none; background: #000;
            opacity: 0; transition: opacity .35s ease;
        }
        #app-frame.loaded { opacity: 1; }

        #loader {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 40%, #0a1f0a 0%, #000 70%);
            color: #fff;
            transition: opacity .4s ease, visibility .4s ease;
            overflow: hidden;
        }
        #loader.hide { opacity: 0; visibility: hidden; }

        #loader::before {
            content: '';
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,255,100,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,100,.06) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 12s linear infinite;
            pointer-events: none;
        }
        @keyframes gridMove { from { transform: translate(0, 0); } to { transform: translate(40px, 40px); } }

        #loader::after {
            content: '';
            position: absolute; top: 40%; left: 50%;
            width: 320px; height: 320px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0,255,100,.22) 0%, transparent 70%);
            animation: glowPulse 2.4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowPulse { 0%, 100% { opacity: .6; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } }

        .logo-wrap { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; z-index: 2; }
        .ring-outer { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid transparent; border-top-color: #00ff64; border-right-color: rgba(0,255,100,.25); animation: spinCW 1.4s linear infinite; filter: drop-shadow(0 0 6px #00ff64); }
        .ring-middle { position: absolute; inset: -14px; border-radius: 50%; border: 1px solid transparent; border-bottom-color: rgba(0,255,100,.7); border-left-color: transparent; animation: spinCCW 2s linear infinite; }
        .ring-static { position: absolute; inset: -2px; border-radius: 50%; border: 1px solid rgba(0,255,100,.15); }
        @keyframes spinCW  { to { transform: rotate(360deg); } }
        @keyframes spinCCW { to { transform: rotate(-360deg); } }

        .logo-img { position: relative; z-index: 2; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center; background: #000; box-shadow: 0 0 0 2px #00ff64, 0 0 24px rgba(0,255,100,.5), 0 0 60px rgba(0,255,100,.25); animation: logoBounce .8s cubic-bezier(.34,1.56,.64,1); }
        @keyframes logoBounce { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

        .title { font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #fff; text-shadow: 0 0 12px rgba(0,255,100,.6); animation: fadeSlideUp .5s ease .15s both; z-index: 2; }
        .tagline { font-size: 12px; opacity: .7; margin-top: 8px; color: #00ff64; letter-spacing: 2px; text-transform: uppercase; text-align: center; padding: 0 24px; animation: fadeSlideUp .5s ease .25s both; z-index: 2; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .progress-wrap { width: 200px; margin-top: 32px; animation: fadeSlideUp .5s ease .35s both; z-index: 2; }
        .progress-track { width: 100%; height: 4px; background: rgba(0,255,100,.12); border-radius: 99px; overflow: hidden; position: relative; box-shadow: inset 0 0 6px rgba(0,255,100,.2); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00ff64, #4cffaa); border-radius: 99px; box-shadow: 0 0 12px #00ff64, 0 0 24px rgba(0,255,100,.5); animation: fillFast 1.4s cubic-bezier(.4,0,.2,1) forwards; position: relative; }
        @keyframes fillFast { 0% { width: 0%; } 40% { width: 55%; } 70% { width: 82%; } 100% { width: 100%; } }
        
        .percent { font-size: 11px; color: #00ff64; margin-top: 10px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 1px; animation: fadeSlideUp .5s ease .4s both; z-index: 2; }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="logo-wrap">
            <div class="ring-static"></div>
            <div class="ring-middle"></div>
            <div class="ring-outer"></div>
            <img class="logo-img" src="icon.png" alt="Cyber Tools" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22>🛡️</text></svg>';">
        </div>
        <div class="title">Cyber Tools</div>
        <div class="tagline">Privacy Toolkit</div>
        <div class="progress-wrap">
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
            <div class="percent" id="percentText">0%</div>
        </div>
    </div>

    <!-- Main WebView Frame -->
    <iframe id="app-frame"
            src="https://arifmolla123.github.io/Cybertools/"
            allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen"
            style="position:fixed; inset:0; width:100%; height:100%; border:none;">
    </iframe>

    <script>
        const frame = document.getElementById('app-frame');
        const loader = document.getElementById('loader');
        const percent = document.getElementById('percentText');

        // Simple fake progress bar
        let pct = 0;
        const pctInterval = setInterval(() => {
            pct += Math.floor(Math.random() * 8) + 4;
            if (pct >= 100) { pct = 100; clearInterval(pctInterval); }
            percent.textContent = pct + '%';
        }, 60);

        // When site loads inside iframe
        frame.addEventListener('load', () => {
            clearInterval(pctInterval);
            percent.textContent = '100%';
            setTimeout(() => {
                loader.classList.add('hide');
                frame.classList.add('loaded');
            }, 300);
        });

        // Fallback: Force hide loader after 5 seconds regardless
        setTimeout(() => {
            loader.classList.add('hide');
            frame.classList.add('loaded');
        }, 5000);
    </script>
</body>
</html>
