<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Engineering - Cyber Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');
        
        :root { 
            --neon-green: #00ff41; 
            --deep-green: #00cc33; 
            --bg-dark: #030306; 
            --panel-bg: rgba(10, 16, 26, 0.85); 
            --glow-color: rgba(0, 255, 65, 0.3);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Share Tech Mono', monospace; 
            padding: 25px 20px; 
            min-height: 100vh; 
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.015) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(0, 255, 65, 0.015) 1px, transparent 1px); 
            background-size: 30px 30px; 
        }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        .header { 
            display: flex; 
            align-items: center; 
            margin-bottom: 35px; 
            background: var(--panel-bg); 
            padding: 16px 20px; 
            border-radius: 16px; 
            border: 2px solid var(--deep-green); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .header a { 
            color: var(--neon-green); 
            font-size: 1.1rem; 
            margin-right: 20px; 
            text-decoration: none; 
            width: 38px; 
            height: 38px; 
            background: rgba(0, 255, 65, 0.05); 
            border: 1px solid var(--deep-green); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
        }
        
        .header a:hover { 
            box-shadow: 0 0 18px var(--neon-green); 
            background: var(--neon-green); 
            color: #000;
            border-color: var(--neon-green);
        }
        
        .header h2 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.95rem; 
            letter-spacing: 2px; 
            font-weight: 700; 
            text-transform: uppercase;
        }
        
        .header span { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 65, 0.6); }
        
        .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .tool-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            background: var(--panel-bg); 
            padding: 24px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            border: 2px solid var(--deep-green); 
            text-decoration: none; 
            color: white; 
            text-align: center; 
            min-height: 180px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            position: relative; 
            overflow: hidden; 
        }
        
        .tool-card::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 2px; 
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent); 
            transform: translateX(-100%); 
            transition: 0.5s; 
        }
        
        .tool-card:hover::before { transform: translateX(100%); }
        
        .tool-card:hover, .tool-card:active { 
            border-color: var(--neon-green); 
            box-shadow: 0 0 35px rgba(0, 255, 65, 0.35), inset 0 0 15px rgba(0, 255, 65, 0.15); 
            transform: translateY(-6px); 
            background: rgba(10, 25, 20, 0.9); 
        }
        
        .tool-icon { 
            background: rgba(0, 0, 0, 0.6); 
            width: 56px; 
            height: 56px; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--neon-green); 
            font-size: 1.6rem; 
            border: 1px solid var(--deep-green); 
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.1); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 16px;
        }
        
        .tool-card:hover .tool-icon { 
            color: #030306; 
            background: var(--neon-green); 
            box-shadow: 0 0 25px var(--neon-green); 
            border-color: var(--neon-green);
            transform: scale(1.05);
        }
        
        .tool-card h4 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.85rem; 
            margin-bottom: 8px; 
            letter-spacing: 1px; 
            font-weight: 700;
            color: #ffffff;
            transition: color 0.3s;
        }
        
        .tool-card:hover h4 {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }
        
        .tool-card p { 
            font-size: 0.68rem !important; 
            color: #8e8e9a; 
            line-height: 1.4; 
            transition: color 0.3s;
        }
        
        .tool-card:hover p { color: #d1d1db; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a id="backBtn"><i class="fas fa-chevron-left"></i></a>
            <h2>Web Tools // <span>Web Engineering</span></h2>
        </div>
        
        <div class="tools-grid">
            <a href="../tools/url-shortner.html" class="tool-card">
                <div class="tool-icon"><i class="fas fa-link"></i></div>
                <h4>URL Shortener</h4>
                <p>Transform long payload architecture links into secure short URLs.</p>
            </a>
        </div>
    </div>

    <script>
        document.getElementById('backBtn').addEventListener('click', function() {
            localStorage.setItem('redirectBack', 'true');
            window.location.href = '../index.html'; 
        });
    </script>
</body>
</html>
