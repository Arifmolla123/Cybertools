name: Build Cyber Tools APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Verify www folder
        run: |
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html missing"
            exit 1
          fi
          echo "OK: www/index.html found"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy MainActivity.java override
        run: |
          MAIN_PATH=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          echo "Found MainActivity at: $MAIN_PATH"
          cp android-overrides/MainActivity.java "$MAIN_PATH"
          echo "Replaced with custom MainActivity"

      - name: Update AndroidManifest.xml
        run: |
          python3 .github/scripts/update_manifest.py

      - name: Update variables.gradle
        run: |
          GRADLE_FILE="android/variables.gradle"
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' $GRADLE_FILE
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' $GRADLE_FILE
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' $GRADLE_FILE
          cat $GRADLE_FILE

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy and rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CyberTools.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberTools-APK
          path: output/CyberTools.apk
          retention-days: 30