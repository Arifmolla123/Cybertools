name: Build Cyber Tools APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NPM Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Custom Icons
        run: |
          # @capacitor/assets ইনস্টল করা
          npm install -g @capacitor/assets
          
          # resources ফোল্ডার তৈরি করা (assets জেনারেটরের জন্য)
          mkdir -p resources
          
          # আপনার www/icon.png কে resources/icon.png হিসেবে কপি করা
          if [ -f "www/icon.png" ]; then
            cp www/icon.png resources/icon.png
            # আইকন জেনারেট করা (কালো ব্যাকগ্রাউন্ড সহ)
            capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
            echo "✅ Icons Generated Automatically"
          else
            echo "⚠️ www/icon.png not found. Using default icon."
          fi

      - name: Copy Custom MainActivity
        run: |
          MAIN_PATH=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cp android-overrides/MainActivity.java "$MAIN_PATH"

      - name: Update Android Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>||' $MANIFEST
          cat >> $MANIFEST << 'EOF'
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          </manifest>
          EOF
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:largeHeap="true"|' $MANIFEST

      - name: Update Gradle Variables
        run: |
          GRADLE_FILE="android/variables.gradle"
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' $GRADLE_FILE
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' $GRADLE_FILE
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' $GRADLE_FILE

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew clean assembleDebug

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CyberTools.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberTools-APK
          path: output/CyberTools.apk
          retention-days: 30
