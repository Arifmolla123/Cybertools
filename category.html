<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category - Cyber Tools</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --accent: #00ff41; --bg: #0d0d0d; --card: #1a1a1a; --text-muted: #888; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background-color: #000; color: #fff; overflow-x: hidden; padding-bottom: 80px; }

  header { display: flex; justify-content: space-between; padding: 15px 20px; align-items: center; position: sticky; top: 0; background: #000; z-index: 100; }
  .logo { color: var(--accent); font-weight: bold; letter-spacing: 2px; font-size: 1.05rem; }
  .icon-btn { font-size: 1.2rem; cursor: pointer; color: #fff; }

  .search-area { padding: 10px 20px; position: relative; }
  .search-area input { width: 100%; background: var(--card); border: 1px solid #222; padding: 12px 45px; border-radius: 12px; color: #fff; outline: none; }
  .search-area input:focus { border-color: var(--accent); }
  .search-area i { position: absolute; top: 23px; color: var(--text-muted); }
  .search-area .fa-search { left: 35px; }

  .section-label { display: flex; justify-content: space-between; padding: 15px 20px 10px; font-size: 0.75rem; color: var(--text-muted); font-weight: bold; letter-spacing: 1px; }
  .count-badge { color: var(--accent); font-weight: 700; }

  .tool-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 20px 12px;
  }

  .tool-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--card);
    padding: 15px 10px;
    border-radius: 15px;
    cursor: pointer;
    text-decoration: none;
    color: white;
    text-align: center;
    min-height: 125px;
    border: 1px solid rgba(0, 255, 65, 0.3);
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.15);
    transition: all 0.3s ease-in-out;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.6s ease-out both;
  }
  .tool-card:nth-child(1) { animation-delay: 0.05s; }
  .tool-card:nth-child(2) { animation-delay: 0.15s; }
  .tool-card:nth-child(3) { animation-delay: 0.25s; }
  .tool-card:nth-child(4) { animation-delay: 0.35s; }
  .tool-card:nth-child(5) { animation-delay: 0.45s; }
  .tool-card:nth-child(6) { animation-delay: 0.55s; }
  .tool-card:nth-child(7) { animation-delay: 0.65s; }
  .tool-card:nth-child(8) { animation-delay: 0.75s; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.08), transparent);
    transform: skewX(-25deg);
    animation: scanLine 3.5s infinite;
    pointer-events: none;
  }
  @keyframes scanLine { 0% { left: -100%; } 100% { left: 200%; } }

  .tool-card:hover {
    border-color: #00ff41;
    box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
    transform: translateY(-4px);
  }
  .tool-card:hover::before { animation-duration: 0.8s; }

  .tool-icon {
    background: #000; width: 45px; height: 45px;
    border-radius: 10px; display: flex;
    align-items: center; justify-content: center;
    color: var(--accent); margin-bottom: 10px; font-size: 1.2rem;
  }
  .tool-card h4 { font-size: 0.85rem; margin-bottom: 4px; word-break: break-word; }
  .tool-card p { font-size: 0.68rem; color: #888; line-height: 1.2; }

  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 0.9rem;
  }
  .empty-msg i {
    display: block;
    font-size: 2.5rem;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; z-index: 1000; }
  .nav-btn { text-align: center; color: var(--text-muted); text-decoration: none; flex: 1; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn i { display: block; font-size: 1.2rem; margin-bottom: 4px; }
  .nav-btn span { font-size: 0.7rem; }
</style>
</head>
<body>

<header>
  <a href="index.html" style="color:white;text-decoration:none;"><i class="fas fa-arrow-left icon-btn"></i></a>
  <h1 class="logo" id="pageTitle">CATEGORY</h1>
  <div style="width:20px;"></div>
</header>

<div class="search-area">
  <i class="fas fa-search"></i>
  <input type="text" id="toolSearch" placeholder="Search in this category...">
</div>

<div class="section-label">
  <span id="label">TOOLS</span>
  <span class="count-badge" id="countBadge">0</span>
</div>
<div class="tool-list" id="toolList"></div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-btn"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="vip-tools.html" class="nav-btn"><i class="fas fa-crown"></i><span>VIP Tools</span></a>
  <a href="favorite.html" class="nav-btn"><i class="fas fa-fire"></i><span>Popular</span></a>
</nav>

<script src="tools.js"></script>
<script>
(function () {
  "use strict";

  var toolListEl = document.getElementById("toolList");
  var pageTitle = document.getElementById("pageTitle");
  var labelEl = document.getElementById("label");
  var countBadge = document.getElementById("countBadge");
  var searchInput = document.getElementById("toolSearch");

  // ---- Read ?cat=Name from URL ----
  var params = new URLSearchParams(window.location.search);
  var catName = params.get("cat") || "";
  var catKey = catName.toLowerCase();

  // ---- Filter tools by category ----
  var allTools = window.TOOLS || [];
  var catTools = catName
    ? allTools.filter(function (t) {
        return (t.category || "").toLowerCase() === catKey;
      })
    : allTools;

  // ---- Update title and label ----
  var titleText = catName ? catName.toUpperCase() + " TOOLS" : "ALL TOOLS";
  pageTitle.textContent = titleText;
  labelEl.textContent = titleText;
  countBadge.textContent = catTools.length + (catTools.length === 1 ? " tool" : " tools");

  // ---- Render ----
  function renderTools(items) {
    toolListEl.innerHTML = "";
    if (!items.length) {
      toolListEl.innerHTML =
        '<div class="empty-msg">' +
          '<i class="fas fa-inbox"></i>' +
          'No tools in this category yet.<br>' +
          '<span style="font-size:0.8rem;opacity:0.7;">Add tools from tools.js</span>' +
        '</div>';
      return;
    }
    items.forEach(function (tool, idx) {
      var a = document.createElement("a");
      a.className = "tool-card";
      a.href = tool.url;
      if (idx >= 8) a.style.animationDelay = Math.min(0.85 + (idx - 8) * 0.1, 1.5) + "s";
      a.innerHTML =
        '<div class="tool-icon"><i class="' + tool.icon + '"></i></div>' +
        '<h4>' + tool.title + '</h4>' +
        '<p>' + tool.desc + '</p>';
      toolListEl.appendChild(a);
    });
  }

  // ---- Search inside this category ----
  searchInput.addEventListener("input", function () {
    var q = this.value.toLowerCase().trim();
    if (!q) {
      countBadge.textContent = catTools.length + (catTools.length === 1 ? " tool" : " tools");
      renderTools(catTools);
      return;
    }
    var filtered = catTools.filter(function (t) {
      return t.title.toLowerCase().indexOf(q) !== -1 ||
             t.desc.toLowerCase().indexOf(q) !== -1;
    });
    countBadge.textContent = filtered.length + " of " + catTools.length;
    renderTools(filtered);
  });

  // ---- Init ----
  renderTools(catTools);
})();
</script>

</body>
</html>
