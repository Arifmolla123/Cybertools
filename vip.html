        .tool-card h4 { font-size: 0.85rem; margin-bottom: 4px; word-break: break-word; }

            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(6px); 
            box-sizing: border-box;
        }
        
        /*        */
        .lock-card { 
            background: #0a0a0a; 
            border: 2px solid gold; 
            padding: 30px 25px; 
            border-radius: 25px; 
            width: 90%; 
            max-width: 340px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); 
            box-sizing: border-box;
            margin: auto; /*     -    */
        }
        
        .lock-card i.fa-shield-halved { color: gold; font-size: 3.5rem; margin-bottom: 15px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .lock-card h3 { font-size: 1.35rem; font-weight: 700; color: gold; margin: 0 0 10px 0; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; }
        .lock-card p { font-size: 0.82rem; color: #aaa; margin: 0 0 20px 0; line-height: 1.4; text-align: center; padding: 0 5px; }
        
        /*      */
        .whatsapp-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; text-decoration: none; width: 100%; box-shadow: 0 4px 15px rgba(37,211,102,0.25); transition: 0.3s; margin-bottom: 20px; box-sizing: border-box; }
        .whatsapp-btn:hover { transform: translateY(-2px); background: #20ba5a; box-shadow: 0 6px 20px rgba(37,211,102,0.4); }

        /*       */
        .input-group { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; box-sizing: border-box; }
        .lock-card input { width: 100%; background: #000; border: 1px solid #252525; padding: 12px; border-radius: 12px; color: #00ff41; font-size: 0.88rem; outline: none; text-align: center; font-weight: bold; transition: 0.3s; box-sizing: border-box; }
        .lock-card input:focus { border-color: gold; box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); background: #030303; }
        .lock-card input::placeholder { color: #555; font-size: 0.8rem; letter-spacing: 0.5px; }
        
        /*    */
        .activate-btn { background: gold; color: #000; border: none; padding: 13px 0; border-radius: 12px; font-size: 0.95rem; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); box-sizing: border-box; }

    <script>
        //  
        const firebaseConfig = {
            apiKey: "AIzaSyDS2PkxK-i6I8ayI-l_f5XctS8YG1mbbI0",
            authDomain: "admin-panel-1946a.firebaseapp.com",
            databaseURL: "https://admin-panel-1946a-default-rtdb.firebaseio.com/",
            projectId: "admin-panel-1946a",
            storageBucket: "admin-panel-1946a.firebasestorage.app",
            messagingSenderId: "78923664766",
            appId: "1:78923664766:web:e599e323cca341ab14772f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        //     
        let deviceToken = localStorage.getItem('app_device_token');
        if (!deviceToken) {
            deviceToken = 'DEV-' + Math.random().toString(36).substring(2, 11).toUpperCase() + '-' + Date.now();
            localStorage.setItem('app_device_token', deviceToken);
        }

        //       
        window.onload = function() {
            let localStatus = localStorage.getItem('vip_status');
            let myUsername = localStorage.getItem('my_username');

            if (localStatus === 'active' && myUsername) {
                database.ref('vip_users/' + myUsername).once('value').then((snapshot) => {
                    let userData = snapshot.val();
                    
                    if (userData && userData.status === 'active' && userData.device_id === deviceToken) {
                        document.getElementById('vipLockSystem').style.display = 'none'; 
                        document.getElementById('vipUsername').innerText = userData.username.toUpperCase();
                        document.querySelector('.vip-box').style.display = 'block'; 
                    } else {
                        clearVipSession();
                        document.getElementById('vipLockSystem').style.display = 'flex'; 
                    }
                }).catch(() => {
                    document.getElementById('vipLockSystem').style.display = 'none';
                    let backupName = localStorage.getItem('vip_user') || "USER";
                    document.getElementById('vipUsername').innerText = backupName.toUpperCase();
                    document.querySelector('.vip-box').style.display = 'block'; 
                });
            } else {
                document.getElementById('vipLockSystem').style.display = 'flex'; 
            }
        }

        //      - 
        function submitModalKey() {
            let nameInput = document.getElementById('modalName').value.trim();
            let keyInput = document.getElementById('modalKey').value.trim();

            if (!nameInput || !keyInput) {
                alert("Please fill in both the Name and Key boxes!");
                return;
            }

            const secretWord = "ARIF_KING_786"; 
            const validKey = btoa(nameInput.toLowerCase() + secretWord).substring(0, 10).toUpperCase();

            if (keyInput.toUpperCase() === validKey) {
                let cleanNodeName = nameInput.replace(/[.#$\[\]]/g, ""); 
                
                database.ref('vip_users/' + cleanNodeName).once('value').then((snapshot) => {
                    let existingUser = snapshot.val();

                    if (existingUser && existingUser.device_id !== deviceToken) {
                        alert(" ACCESS DENIED!\nThis VIP Key is already registered and locked to another device!");
                        return;
                    }

                    localStorage.setItem('vip_status', 'active');
                    localStorage.setItem('my_username', cleanNodeName);
                    localStorage.setItem('vip_user', nameInput);
                    localStorage.setItem('vip_key', keyInput); // 🔥 এই নতুন লাইনটি এখানে অ্যাড করা হয়েছে

                    database.ref('vip_users/' + cleanNodeName).set({
                        username: nameInput,
                        vip_key: keyInput,
                        status: "active",
                        device_id: deviceToken,
                        activated_at: new Date().toLocaleString()
                    }).then(() => {
                        alert("[+] Access Granted! VIP Unlocked Successfully.");
                        document.getElementById('vipLockSystem').style.display = 'none'; 
                        document.getElementById('vipUsername').innerText = nameInput.toUpperCase();
                        document.querySelector('.vip-box').style.display = 'block'; 
                    });
                });
            } else {
                alert("[-] Invalid Key! The information you provided is incorrect.");
            }
        }

        function clearVipSession() {
            localStorage.removeItem('vip_status');
            localStorage.removeItem('my_username');
            localStorage.removeItem('vip_user');
            localStorage.removeItem('vipUser');
            localStorage.removeItem('vipKey');
            localStorage.removeItem('vipStatus');
            localStorage.removeItem('vipExpiryDate');
        }

        function logoutVip() {
            if(confirm("Are you sure you want to lock VIP access on this browser?")) {
                let myUsername = localStorage.getItem('my_username');
                if (myUsername) {
                    database.ref('vip_users/' + myUsername).remove().then(() => {
                        clearVipSession();
                        document.querySelector('.vip-box').style.display = 'none'; 
                        document.getElementById('vipLockSystem').style.display = 'flex';
                        alert("[+] VIP Access Locked successfully!");
                    });
                } else {
                    clearVipSession();
                    document.querySelector('.vip-box').style.display = 'none'; 
                    document.getElementById('vipLockSystem').style.display = 'flex';
                }
            }
        }
    </script>
