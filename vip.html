<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
        
        .header { display: flex; align-items: center; text-align: left; margin-bottom: 20px; flex-shrink: 0; }
        .header a { color: #00ff41; font-size: 1.5rem; margin-right: 20px; text-decoration: none; }
        
        /* VIP ব্যানার */
        .vip-box { border: 1px solid gold; padding: 20px 15px; border-radius: 20px; background: #0a0a0a; margin-bottom: 20px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); flex-shrink: 0; }
        .gold { color: gold; }

        .premium-section-title { text-align: left; font-size: 1rem; color: gold; font-weight: bold; margin: 10px 5px 15px; letter-spacing: 1px; flex-shrink: 0; }
        
        .scrollable-tools-container { max-height: 280px; overflow-y: auto; padding: 2px; margin-bottom: 20px; border-radius: 10px; }
        .scrollable-tools-container::-webkit-scrollbar { width: 4px; }
        .scrollable-tools-container::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

        .tool-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
        
        .tool-card { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; padding: 15px 10px; border-radius: 15px; cursor: pointer; border: 1px solid #222; text-decoration: none; color: white; transition: 0.3s; min-height: 125px; }
        .tool-card:hover { border-color: gold; }
        
        .tool-icon { background: #000; width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: gold; margin-bottom: 10px; border: 1px solid #333; }
        
        .tool-card h4 { font-size: 0.85rem; margin-bottom: 4px; word-break: break-word; }
        .tool-card p { font-size: 0.68rem; color: #888; line-height: 1.2; }
        
        /* Logout Button Style */
        .logout-btn { background: transparent; border: 1px solid #ff3e3e; color: #ff3e3e; padding: 12px 15px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; flex-shrink: 0; }
        .logout-btn:hover { background: #ff3e3e; color: #fff; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // 🔑 আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDS2PkxK-i6I8ayI-l_f5XctS8YG1mbbI0",
            authDomain: "admin-panel-1946a.firebaseapp.com",
            databaseURL: "https://admin-panel-1946a-default-rtdb.firebaseio.com/",
            projectId: "admin-panel-1946a",
            storageBucket: "admin-panel-1946a.firebasestorage.app",
            messagingSenderId: "78923664766",
            appId: "1:78923664766:web:e599e323cca341ab14772f"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ করুন
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 🛡️ অ্যাডভান্সড ক্লাউড অ্যান্ড ডিভাইস লকিং চেক গেটওয়ে
        let localStatus = localStorage.getItem('vip_status');
        let myUsername = localStorage.getItem('my_username');
        let localDeviceToken = localStorage.getItem('app_device_token');

        if (localStatus === 'active' && myUsername) {
            // ক্লাউড ডাটাবেজ থেকে লাইভ মিলিয়ে দেখা হচ্ছে
            database.ref('vip_users/' + myUsername).once('value').then((snapshot) => {
                let userData = snapshot.val();
                
                // ১. যদি সার্ভারে ডেটা না থাকে, বা স্ট্যাটাস active না থাকে, বা অন্য কোনো ডিভাইসের টোকেন লক থাকে
                if (!userData || userData.status !== 'active' || userData.device_id !== localDeviceToken) {
                    clearVipSession();
                    window.location.href = "index.html";
                }
            }).catch(() => {
                // নেটওয়ার্ক ফেইলুর হলে যেন হঠাৎ করে ইউজারকে কিক আউট না করে, তাই লোকাল সেশন ব্যাকআপ রাখবে
            });
        } else {
            // কোনো সেশন ডেটা না থাকলে সরাসরি ব্যাক করে দেবে
            window.location.href = "index.html";
        }

        function clearVipSession() {
            localStorage.removeItem('vip_status');
            localStorage.removeItem('my_username');
            localStorage.removeItem('vip_user');
            localStorage.removeItem('vipUser');
            localStorage.removeItem('vipKey');
            localStorage.removeItem('vipStatus');
            localStorage.removeItem('vipExpiryDate');
        }
    </script>
</head>
<body>

    <div class="header">
        <a href="index.html"><i class="fas fa-arrow-left"></i></a> 
        <h2>VIP Menu</h2>
    </div>

    <div class="vip-box">
        <i class="fas fa-crown gold" style="font-size: 3rem; margin-bottom: 10px;"></i>
        <h2 class="gold">VIP ACCESS GRANTED</h2>
        <p style="color: #888; margin: 10px 0 0;">Welcome back, <span id="vipUsername" style="color: #00ff41; font-weight: bold;">User</span>! Enjoy your premium privileges.</p>
    </div>

    <button class="logout-btn" onclick="logoutVip()">Lock VIP Menu</button>

    <script>
        window.onload = function() {
            let myUsername = localStorage.getItem('my_username');
            let localDeviceToken = localStorage.getItem('app_device_token');
            
            if (myUsername) {
                // ফায়ারবেস ক্লাউড থেকে ইউজারের অরিজিনাল রেজিস্টার্ড নাম তুলে আনা
                database.ref('vip_users/' + myUsername).once('value').then((snapshot) => {
                    let userData = snapshot.val();
                    
                    // এখানেও ডিভাইস আইডি ডাবল চেক করা হচ্ছে সিকিউরিটির জন্য
                    if (userData && userData.username && userData.device_id === localDeviceToken) {
                        document.getElementById('vipUsername').innerText = userData.username.toUpperCase();
                        
                        // ব্যাকগ্রাউন্ড ডেটা সিনক্রোনাইজেশন (অন্যান্য পেজের সামঞ্জস্যের জন্য)
                        localStorage.setItem('vip_user', userData.username);
                        localStorage.setItem('vipUser', userData.username);
                        localStorage.setItem('vipKey', userData.vip_key);
                        localStorage.setItem('vipStatus', 'Active');
                        localStorage.setItem('vipExpiryDate', userData.expiry || 'LIFETIME');
                    } else {
                        // ডেটা ও টোকেন মিসম্যাচ হলে সাথে সাথে পেজ ক্লিয়ার করে বের করে দেবে
                        clearVipSession();
                        window.location.href = "index.html";
                    }
                });
            }
        }

        // 📡 ক্লাউড এবং লোকাল থেকে ইউজার লক/লগআউট করার ফাংশন
        function logoutVip() {
            if(confirm("Are you sure you want to lock VIP access on this browser?")) {
                let myUsername = localStorage.getItem('my_username');

                if (myUsername) {
                    // ১. ফায়ারবেস অনলাইন ক্লাউড থেকে ডাটাটি রিমুভ করে দেওয়া যাতে অ্যাডমিন প্যানেল ক্লিয়ার থাকে
                    database.ref('vip_users/' + myUsername).remove().then(() => {
                        // ২. লোকাল স্টোরেজের সমস্ত মেমোরি ডিলিট করা
                        clearVipSession();
                        alert("[+] VIP Access Locked and Session Cleared from Cloud!");
                        window.location.href = "index.html";
                    }).catch((err) => {
                        // এরর আসলেও সেফটির জন্য লোকাল ডেটা ক্লিয়ার করে রিডাইরেক্ট করবে
                        clearVipSession();
                        window.location.href = "index.html";
                    });
                } else {
                    clearVipSession();
                    window.location.href = "index.html";
                }
            }
        }
    </script>
</body>
</html>
