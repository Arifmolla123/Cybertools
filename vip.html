        function getRemainingTime(expiryDate) {
            if (expiryDate === "lifetime") return "Lifetime";
            const now = new Date();
            const exp = new Date(expiryDate);
            const diffMs = exp - now;
            if (diffMs <= 0) return "Expired";
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            if (diffDays >= 30) {
                const months = Math.floor(diffDays / 30);
                const remainingDays = diffDays % 30;
                if (remainingDays === 0) return months + " month" + (months > 1 ? "s" : "") + " left";
                return months + " month" + (months > 1 ? "s" : "") + " " + remainingDays + " day" + (remainingDays > 1 ? "s" : "") + " left";
            } else {
                return diffDays + " day" + (diffDays > 1 ? "s" : "") + " left";
            }
        }

        window.onload = function() {
            let localStatus = localStorage.getItem('vip_status');
            let myUsername = localStorage.getItem('my_username');
            if (localStatus === 'active' && myUsername) {
                database.ref('vip_users/' + myUsername).once('value').then((snapshot) => {
                    let userData = snapshot.val();
                    if (userData && userData.status === 'active' && userData.device_id === deviceToken) {
                        let expiry = userData.expiry;
                        if (expiry && expiry !== "lifetime") {
                            let now = new Date();

                    } else {

                        document.getElementById('vipLockSystem').style.display = 'flex';
                    }

                    let backupName = localStorage.getItem('vip_user') || "USER";

                    document.querySelector('.vip-box').style.display = 'block';
                });

        }

            }

            let lowerName = nameInput.toLowerCase().replace(/[.#$\[\]]/g, "");
            let displayName = nameInput;
            const validKey = generateKey(lowerName);
            const enteredKey = keyInput.toUpperCase();

            if (enteredKey !== validKey) {
                alert("❌ Invalid Key! Please check your information.");
                return;
            }

            // 1. Check deleted_accounts (locked or blacklisted)
            database.ref('deleted_accounts/' + lowerName).once('value').then((deletedSnap) => {
                let deletedData = deletedSnap.val();

} else if (deletedData) {

    return;
}

                // 2. Check if user already exists
                database.ref('vip_users/' + lowerName).once('value').then((snapshot) => {

                            }).then(() => {

                                localStorage.setItem('vip_user', displayName);

                                alert("[+] Account reactivated by admin. You are now logged in.");

                                document.getElementById('expiryDisplay').innerText = "⏳ " + remaining;
                            });
                        } else if (currentDevice === deviceToken) {

                            localStorage.setItem('vip_user', displayName);

                                expiry = planData.expiry;

            localStorage.removeItem('vipKey');
            localStorage.removeItem('vipStatus');
            localStorage.removeItem('vipExpiryDate');
        }

            if(confirm("Are you sure you want to lock VIP access? Your account will be removed, but you can reactivate with the same key later.")) {

                if (username) {

                    database.ref('vip_users/' + lowerName).once('value').then((snap) => {
                        let userData = snap.val();
                        if (!userData) { 
                            alert("User not found.");
                            return;
                        }
                        // deleted_accounts-এ locked হিসেবে সংরক্ষণ
                        return database.ref('deleted_accounts/' + lowerName).set({
                            deleted_at: new Date().toLocaleString(),
                            device_id: userData.device_id || "unknown",
                            locked: true,
                            username: userData.username,
                            vip_key: userData.vip_key || "UNKNOWN",
                            expiry: userData.expiry || "lifetime"
                        }).then(() => {
                            // vip_users থেকে রিমুভ
                            return database.ref('vip_users/' + lowerName).remove();
                        });
                    }).then(() => {
                        clearVipSession();
                        document.querySelector('.vip-box').style.display = 'none';
                        document.getElementById('vipLockSystem').style.display = 'flex';
                        alert("[+] VIP Locked. Account removed with expiry preserved.");
                    }).catch((err) => {
                        alert("Error: " + err.message);
                    });
                } else {
                    clearVipSession();
                    document.querySelector('.vip-box').style.display = 'none';
                    document.getElementById('vipLockSystem').style.display = 'flex';
                    alert("[+] VIP Locked.");
                }
