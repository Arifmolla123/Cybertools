<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber All Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            color: #38bdf8;
        }
        .login-card input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        .login-card input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            color: #f1f5f9;
        }
        .btn-cyber {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }
        .btn-cyber:hover {
            background: #7dd3fc;
            transform: scale(1.02);
        }
        .dashboard-bg {
            background: #0b0e14;
            min-height: 100vh;
            padding: 20px;
        }
        .header-cyber {
            background: #1e293b;
            border-bottom: 2px solid #334155;
            padding: 15px 0;
            margin-bottom: 30px;
            border-radius: 0 0 16px 16px;
        }
        .header-cyber h1 {
            color: #38bdf8;
            font-weight: 800;
            font-size: 28px;
        }
        .header-cyber h1 i {
            color: #facc15;
        }
        .add-panel-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .add-panel-box input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        .add-panel-box input:focus {
            border-color: #38bdf8;
            box-shadow: none;
            color: #f1f5f9;
        }
        .add-panel-box input::placeholder {
            color: #64748b;
        }
        .search-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 10px 20px;
            margin-bottom: 25px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #f1f5f9;
            padding: 8px 0;
            width: 100%;
        }
        .search-box input:focus {
            outline: none;
        }
        .search-box i {
            color: #64748b;
        }
        .panel-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel-card:hover {
            border-color: #38bdf8;
            transform: translateY(-5px);
        }
        .panel-card .card-title {
            color: #f1f5f9;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .panel-card .card-title i {
            color: #facc15;
            margin-right: 8px;
        }
        .panel-card .btn-go {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            border: none;
            padding: 10px 0;
            border-radius: 8px;
            width: 100%;
            margin: 12px 0 8px 0;
            transition: 0.3s;
        }
        .panel-card .btn-go:hover {
            background: #7dd3fc;
        }
        .btn-edit-cyber {
            background: transparent;
            border: 1px solid #facc15;
            color: #facc15;
            padding: 4px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-edit-cyber:hover {
            background: #facc15;
            color: #0f172a;
        }
        .btn-del-cyber {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 4px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-del-cyber:hover {
            background: #ef4444;
            color: #fff;
        }
        .empty-state {
            color: #64748b;
            text-align: center;
            padding: 60px 0;
        }
        .empty-state i {
            font-size: 4rem;
            color: #334155;
            margin-bottom: 15px;
        }
        .modal-content {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
        }
        .modal-content input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        .modal-content input:focus {
            border-color: #38bdf8;
            box-shadow: none;
        }
    </style>
</head>
<body>

<!-- ===== LOGIN PAGE (password not shown) ===== -->
<div id="loginSection" class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-halved" style="font-size: 3rem; color: #38bdf8;"></i>
            <h2 class="mt-2">Cyber All Admin</h2>
            <p class="text-secondary">Enter password to login</p>
        </div>
        <div id="loginError" class="alert alert-danger d-none">❌ Wrong password!</div>
        <input type="password" id="passwordInput" class="form-control mb-3" placeholder="Enter password" onkeydown="if(event.key==='Enter') login()" autofocus>
        <button onclick="login()" class="btn btn-cyber w-100 py-2"><i class="fas fa-key"></i> Login</button>
        <!-- Default password hint removed intentionally -->
    </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboardSection" class="dashboard-bg d-none">

    <div class="header-cyber">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <h1><i class="fas fa-skull"></i> Cyber All Admin</h1>
                <div>
                    <span class="badge bg-success me-2"><i class="fas fa-circle" style="font-size: 0.6rem;"></i> Online</span>
                    <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">

        <!-- Add Panel Form -->
        <div class="add-panel-box">
            <h5 class="mb-3"><i class="fas fa-plus-circle text-success"></i> Add New Panel</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="panelName" class="form-control" placeholder="Name (e.g. arif)">
                </div>
                <div class="col-md-4">
                    <input type="text" id="panelFile" class="form-control" placeholder="File (e.g. arif.html)">
                </div>
                <div class="col-md-4">
                    <button onclick="addPanel()" class="btn btn-cyber w-100"><i class="fas fa-save"></i> Add Panel</button>
                </div>
            </div>
            <div class="text-secondary small mt-2"><i class="fas fa-arrow-up"></i> New panel will be added at the <strong>top</strong> of the list.</div>
        </div>

        <!-- Search -->
        <div class="search-box d-flex align-items-center">
            <i class="fas fa-search me-2"></i>
            <input type="text" id="searchInput" placeholder="Search panels by name..." onkeyup="filterPanels()">
        </div>

        <!-- Panel Cards Grid -->
        <div class="row g-4" id="panelCardContainer"></div>

        <div class="text-secondary text-center small mt-4" id="totalCount">Total 0 panels</div>
    </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-pen text-warning"></i> Edit Panel</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" id="editName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">File / URL</label>
                    <input type="text" id="editFile" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-cyber" onclick="saveEdit()"><i class="fas fa-check"></i> Update</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ===== CONFIG (password is here, never shown on screen) =====
    const CORRECT_PASSWORD = 'arif123';
    const STORAGE_KEY = 'cyberPanels';
    const LOGIN_KEY = 'cyberLoggedIn';

    // ===== DATA =====
    function getPanels() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }
    function savePanels(panels) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(panels));
    }

    // ===== LOGIN / LOGOUT =====
    function login() {
        const pass = document.getElementById('passwordInput').value;
        const err = document.getElementById('loginError');
        if (pass === CORRECT_PASSWORD) {
            localStorage.setItem(LOGIN_KEY, 'true');
            err.classList.add('d-none');
            showDashboard();
        } else {
            err.classList.remove('d-none');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }
    }
    function logout() {
        localStorage.removeItem(LOGIN_KEY);
        location.reload();
    }
    function showDashboard() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').classList.remove('d-none');
        renderCards();
    }

    // ===== ADD (unshift = top) =====
    function addPanel() {
        const name = document.getElementById('panelName').value.trim();
        const file = document.getElementById('panelFile').value.trim();
        if (!name || !file) {
            alert('⚠️ Please fill in both name and file!');
            return;
        }
        const panels = getPanels();
        panels.unshift({ id: Date.now(), name, file });
        savePanels(panels);
        renderCards();
        document.getElementById('panelName').value = '';
        document.getElementById('panelFile').value = '';
        document.getElementById('panelName').focus();
    }

    // ===== DELETE =====
    function deletePanel(id) {
        if (!confirm('Are you sure you want to delete this panel?')) return;
        let panels = getPanels();
        panels = panels.filter(p => p.id !== id);
        savePanels(panels);
        renderCards();
    }

    // ===== EDIT =====
    let editModalInstance = null;
    function openEditModal(id) {
        const panels = getPanels();
        const p = panels.find(x => x.id === id);
        if (!p) return;
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = p.name;
        document.getElementById('editFile').value = p.file;
        if (!editModalInstance) {
            editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
        }
        editModalInstance.show();
    }
    function saveEdit() {
        const id = Number(document.getElementById('editId').value);
        const name = document.getElementById('editName').value.trim();
        const file = document.getElementById('editFile').value.trim();
        if (!name || !file) {
            alert('Please fill in both fields!');
            return;
        }
        let panels = getPanels();
        const idx = panels.findIndex(x => x.id === id);
        if (idx === -1) return;
        panels[idx] = { ...panels[idx], name, file };
        savePanels(panels);
        renderCards();
        editModalInstance.hide();
    }

    // ===== SEARCH / FILTER =====
    function filterPanels() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const wrappers = document.querySelectorAll('.panel-card-wrapper');
        let visible = 0;
        wrappers.forEach(w => {
            const title = w.querySelector('.card-title')?.innerText?.toLowerCase() || '';
            if (title.includes(keyword)) {
                w.style.display = 'block';
                visible++;
            } else {
                w.style.display = 'none';
            }
        });
        document.getElementById('totalCount').innerText = `Total ${visible} panels (filtered)`;
    }

    // ===== RENDER CARDS =====
    function renderCards() {
        const panels = getPanels();
        const container = document.getElementById('panelCardContainer');
        const total = document.getElementById('totalCount');

        if (panels.length === 0) {
            container.innerHTML = `<div class="col-12 empty-state"><i class="fas fa-database"></i><h5>No panels added</h5><p class="text-secondary">Add your first panel using the form above.</p></div>`;
            total.innerText = 'Total 0 panels';
            return;
        }

        let html = '';
        panels.forEach(p => {
            html += `
                <div class="col-md-4 col-lg-3 panel-card-wrapper">
                    <div class="panel-card">
                        <div class="card-title"><i class="fas fa-server"></i> ${escapeHtml(p.name)}</div>
                        <button onclick="window.location.href='${escapeHtml(p.file)}'" class="btn-go"><i class="fas fa-arrow-right"></i> Open Panel</button>
                        <div class="mt-2 d-flex justify-content-center gap-2">
                            <button onclick="openEditModal(${p.id})" class="btn-edit-cyber"><i class="fas fa-edit"></i> Edit</button>
                            <button onclick="deletePanel(${p.id})" class="btn-del-cyber"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
        total.innerText = `Total ${panels.length} panels`;
        document.getElementById('searchInput').value = '';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== PAGE LOAD =====
    window.onload = function() {
        if (localStorage.getItem(LOGIN_KEY) === 'true') {
            showDashboard();
        } else {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('dashboardSection').classList.add('d-none');
        }
    };
</script>
</body>
</html>
